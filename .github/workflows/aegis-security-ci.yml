name: AegisGuard Offline Android CI & Airplane Mode E2E

on:
  push:
    branches:
      - arena/1fa88e9a-vodiwalker-panel
    paths:
      - "aegis-security/**"
      - ".github/workflows/aegis-security-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Generate CI Release Signing Keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/keystore/aegis-release.jks" \
            -alias aegis-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "AegisOffline2026!" -keypass "AegisOffline2026!" \
            -dname "CN=AegisGuard, OU=Security, O=AegisOffline, L=Local, C=XX"

      - name: Run All Unit Tests, Lint, Debug & Signed Release APKs
        working-directory: aegis-security
        env:
          AEGIS_KEYSTORE_PATH: ${{ runner.temp }}/keystore/aegis-release.jks
          AEGIS_KEYSTORE_PASSWORD: AegisOffline2026!
          AEGIS_KEY_ALIAS: aegis-release
          AEGIS_KEY_PASSWORD: AegisOffline2026!
        run: |
          gradle --no-daemon --stacktrace \
            test \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            assembleDebugAndroidTest \
            assembleRelease

      - name: Zero-Network Permission Audit & Binary Verification
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          for APK in \
            aegis-security/app/build/outputs/apk/debug/app-debug.apk \
            aegis-security/app/build/outputs/apk/release/app-release.apk; do
            echo "=== Auditing $APK ==="
            PERMS="$("$AAPT" dump permissions "$APK")"
            echo "$PERMS"
            if echo "$PERMS" | grep -qE "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)"; then
              echo "FATAL: Prohibited network permission detected in $APK!"
              exit 1
            fi
          done

          "$ZIPALIGN" -c -P 16 -v 4 aegis-security/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose aegis-security/app/build/outputs/apk/release/app-release.apk

      - name: Package APKs, Exported Schema & Checksums
        run: |
          test -f aegis-security/core/database/schemas/ir.aegis.core.database.AegisDatabase/2.json
          mkdir -p dist-apks
          cp aegis-security/app/build/outputs/apk/debug/app-debug.apk dist-apks/app-debug.apk
          cp aegis-security/app/build/outputs/apk/release/app-release.apk dist-apks/app-release.apk
          (cd dist-apks && sha256sum app-debug.apk app-release.apk > SHA256SUMS.txt)
          cat dist-apks/SHA256SUMS.txt

      - name: Upload Build APKs
        uses: actions/upload-artifact@v4
        with:
          name: aegis-apks
          path: dist-apks/

      - name: Upload Room Schemas & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-build-reports
          path: |
            aegis-security/core/database/schemas/
            aegis-security/**/build/reports/tests/
            aegis-security/app/build/reports/lint-results-debug.html

  airplane-mode-emulator-test:
    needs: build-and-verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Ensure KVM permissions
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

      - name: Run Room Migration & Compose E2E Tests in Airplane Mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell cmd connectivity airplane-mode enable || true
            adb shell settings put global airplane_mode_on 1 || true
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            echo "Airplane mode status:"
            adb shell settings get global airplane_mode_on

            cd aegis-security
            gradle --no-daemon --stacktrace \
              :core:database:connectedDebugAndroidTest \
              :app:connectedDebugAndroidTest

            mkdir -p screenshots
            adb shell am start -n ir.aegis.security/ir.aegis.app.MainActivity
            sleep 4
            adb exec-out screencap -p > screenshots/home_airplane_mode.png
            adb logcat -d -s AndroidRuntime:E | tee screenshots/crash_log.txt
            if grep -q "FATAL EXCEPTION" screenshots/crash_log.txt; then
              echo "FATAL crash detected in logcat!"
              exit 1
            fi

      - name: Upload Airplane Mode Emulator Screenshots & Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-emulator-e2e-results
          path: |
            aegis-security/screenshots/
            aegis-security/core/database/build/reports/androidTests/
            aegis-security/app/build/reports/androidTests/

  publish-release:
    needs: [build-and-verify, airplane-mode-emulator-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: aegis-apks
          path: dist-apks

      - name: Publish GitHub Release with Installable Offline APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist-apks
          RELEASE_TAG="aegis-v1.0.0-offline"
          RELEASE_NOTES="AegisGuard 100% Offline Personal, Family & Community Security Ecosystem (17-module Clean Architecture). Verified zero INTERNET permissions via aapt, Room v1->v2 SQLite migration tested, and full Compose E2E suite passed on Pixel 6 API 34 in Airplane Mode."
          gh release delete "$RELEASE_TAG" --yes || true
          gh release create "$RELEASE_TAG" \
            dist-apks/app-release.apk \
            dist-apks/app-debug.apk \
            dist-apks/SHA256SUMS.txt \
            --target "${{ github.sha }}" \
            --title "AegisGuard v1.0.0 Offline Release APK" \
            --notes "$RELEASE_NOTES"
