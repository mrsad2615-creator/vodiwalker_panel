name: AegisGuard Offline Android CI & Airplane Mode E2E

on:
  push:
    branches:
      - arena/1fa88e9a-vodiwalker-panel
    paths:
      - "aegis-security/**"
      - ".github/workflows/aegis-security-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK (API 36)
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ ! -x "$manager" ]]; then
            echo "::error title=Android SDK::sdkmanager not found under $sdk/cmdline-tools"
            exit 1
          fi
          yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null || true
          if [[ ! -f "$sdk/platforms/android-36/android.jar" || ! -x "$sdk/build-tools/36.0.0/apksigner" ]]; then
            "$manager" --sdk_root="$sdk" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi
          printf 'ANDROID_HOME=%s\n' "$sdk" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$(dirname "$manager")" "$sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Generate CI Release Signing Keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/keystore/aegis-release.jks" \
            -alias aegis-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "AegisOffline2026!" -keypass "AegisOffline2026!" \
            -dname "CN=AegisGuard, OU=Security, O=AegisOffline, L=Local, C=XX"

      - name: Run All Unit Tests, Lint, Debug & Signed Release APKs
        working-directory: aegis-security
        shell: bash
        env:
          AEGIS_KEYSTORE_PATH: ${{ runner.temp }}/keystore/aegis-release.jks
          AEGIS_KEYSTORE_PASSWORD: AegisOffline2026!
          AEGIS_KEY_ALIAS: aegis-release
          AEGIS_KEY_PASSWORD: AegisOffline2026!
        run: |
          set -o pipefail
          if gradle --no-daemon --console=plain --stacktrace --continue \
            test \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            assembleDebugAndroidTest \
            assembleRelease 2>&1 | tee "$RUNNER_TEMP/aegis-gradle.log"; then
            exit 0
          fi
          python3 - "$RUNNER_TEMP/aegis-gradle.log" <<'PYTHON'
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          diagnostics = []
          for index, line in enumerate(lines):
              if (
                  line.lstrip().startswith(('e:', 'Caused by:', 'FAILURE:', '* What went wrong'))
                  or 'Error:' in line
                  or 'FAILED' in line
                  or line.startswith(('> ', 'Execution failed'))
              ):
                  diagnostics.extend(lines[index:index + 6])
          for report in Path('.').glob('**/build/reports/lint-results-debug.txt'):
              diagnostics.extend(
                  line for line in report.read_text(errors='replace').splitlines()
                  if 'Error:' in line or 'Fatal' in line
              )
          if not diagnostics:
              diagnostics = lines[-50:]
          else:
              diagnostics.extend(lines[-25:])
          message = '\n'.join(dict.fromkeys(diagnostics))[:6200]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=AegisGuard Gradle build failed::{message}')
          PYTHON
          exit 1

      - name: Verify JVM Unit Test Counts & Zero-Network APK Audit
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          total_tests = 0
          for report in Path('aegis-security').glob('**/build/test-results/**/TEST-*.xml'):
              for case in ET.parse(report).iter('testcase'):
                  total_tests += 1
                  if case.find('failure') is not None or case.find('error') is not None:
                      raise SystemExit(f"::error title=JVM Test Failure::{case.attrib.get('classname')}.{case.attrib.get('name')}")
          if total_tests < 15:
              raise SystemExit(f"::error title=JVM Tests::Expected >=15 tests, found {total_tests}")
          print(f"Verified {total_tests} passing JVM unit tests across all modules!")
          PYTHON

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          for APK in \
            aegis-security/app/build/outputs/apk/debug/app-debug.apk \
            aegis-security/app/build/outputs/apk/release/app-release.apk; do
            echo "=== Auditing $APK ==="
            PERMS="$("$AAPT" dump permissions "$APK")"
            echo "$PERMS"
            if echo "$PERMS" | grep -qE "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE|CHANGE_WIFI_STATE)"; then
              FLAT_PERMS="$(echo "$PERMS" | tr '\n' ' ')"
              echo "::error title=Network Audit::Prohibited network permission detected in $APK! Found: $FLAT_PERMS"
              exit 1
            fi
          done

          "$ZIPALIGN" -c -P 16 -v 4 aegis-security/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose aegis-security/app/build/outputs/apk/release/app-release.apk

          test -f aegis-security/core/database/schemas/ir.aegis.core.database.AegisDatabase/2.json
          mkdir -p dist-apks
          cp aegis-security/app/build/outputs/apk/debug/app-debug.apk dist-apks/app-debug.apk
          cp aegis-security/app/build/outputs/apk/release/app-release.apk dist-apks/app-release.apk
          (cd dist-apks && sha256sum app-debug.apk app-release.apk > SHA256SUMS.txt)
          cat dist-apks/SHA256SUMS.txt

      - name: Enable KVM Acceleration for Android Emulator
        run: |
          test -c /dev/kvm || { echo '::error title=Android emulator::KVM is unavailable on the runner.'; exit 1; }
          sudo chmod a+rw /dev/kvm

      - name: Run Room Migration & Compose E2E Tests in Airplane Mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell cmd connectivity airplane-mode enable || true
            adb shell settings put global airplane_mode_on 1 || true
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            echo "Airplane mode status:"
            adb shell settings get global airplane_mode_on

            set -o pipefail
            cd aegis-security
            if ! gradle --no-daemon --console=plain --stacktrace \
              :core:database:connectedDebugAndroidTest \
              :app:connectedDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/aegis-e2e.log"; then
              python3 - "$RUNNER_TEMP/aegis-e2e.log" <<'PYTHON'
            import sys
            from pathlib import Path
            lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
            diag = [l for l in lines if 'FAILED' in l or 'Exception' in l or 'Error' in l or 'Caused by:' in l or l.strip().startswith('at ir.aegis')]
            msg = '\n'.join(dict.fromkeys(diag or lines[-50:]))[:6200]
            msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
            print(f'::error title=Emulator E2E Failed::{msg}')
            PYTHON
              exit 1
            fi

            mkdir -p screenshots
            adb shell am start -n ir.aegis.security/ir.aegis.app.MainActivity
            sleep 4
            adb exec-out screencap -p > screenshots/home_airplane_mode.png
            adb logcat -d -s AndroidRuntime:E | tee screenshots/crash_log.txt
            if grep -q "FATAL EXCEPTION" screenshots/crash_log.txt; then
              echo "::error title=Logcat Crash::FATAL crash detected in logcat!"
              exit 1
            fi

      - name: Upload Build APKs
        uses: actions/upload-artifact@v4
        with:
          name: aegis-apks
          path: dist-apks/

      - name: Upload Schemas, Test Reports & Emulator Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-verification-reports
          path: |
            aegis-security/core/database/schemas/
            aegis-security/**/build/reports/
            aegis-security/screenshots/

  publish-release:
    needs: build-and-verify
    runs-on: ubuntu-24.04
    steps:
      - name: Download Verified APKs
        uses: actions/download-artifact@v4
        with:
          name: aegis-apks
          path: dist-apks

      - name: Publish GitHub Release with Installable Offline APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="aegis-v1.0.0-offline"
          RELEASE_NOTES="AegisGuard 100% Offline Personal, Family & Community Security Ecosystem (17-module Clean Architecture). Verified zero INTERNET permissions via aapt, Room v1->v2 SQLite migration tested, and full Compose E2E suite passed on Pixel 6 API 34 in Airplane Mode."
          gh release delete "$RELEASE_TAG" --yes || true
          gh release create "$RELEASE_TAG" \
            dist-apks/app-release.apk \
            dist-apks/app-debug.apk \
            dist-apks/SHA256SUMS.txt \
            --target "${{ github.sha }}" \
            --title "AegisGuard v1.0.0 Offline Release APK" \
            --notes "$RELEASE_NOTES"
