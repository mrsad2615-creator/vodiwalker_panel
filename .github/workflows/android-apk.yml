name: Android APK

on:
  push:
    paths:
      - "black_hole/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: black_hole/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Check, test, and build the offline web experience
        working-directory: black_hole
        run: |
          npm ci
          npm run check
          npm test
          npm run build:standalone

      - name: Assemble debug-signed APK
        run: gradle --no-daemon --stacktrace -p black_hole/android assembleDebug

      - name: Prepare downloadable APK
        run: |
          mkdir -p artifacts
          cp black_hole/android/app/build/outputs/apk/debug/app-debug.apk artifacts/black-hole.apk
          sha256sum artifacts/black-hole.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-hole-apk
          path: artifacts/black-hole.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="black-hole-v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its published APK."
          else
            gh release create "$TAG" artifacts/black-hole.apk --target "$GITHUB_SHA" --title "BLACK HOLE v1.0.0 — Android APK" --notes "APK نصب مستقیم اندروید، شامل تجربه‌ی سه‌بعدی و فارسی. برنامه آفلاین اجرا می‌شود. این نسخه با کلید debug امضا شده و برای نصب مستقیم/آزمایش است؛ برای Google Play به کلید انتشار نیاز دارد."
          fi
