name: Build MRSAD Ambient APK

on:
  push:
    branches: [ "arena/95094f6c-vodiwalker-panel", "main" ]
    paths:
      - "mrsad-ambient/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "mrsad-ambient/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mrsad-ambient

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign & Verify Release APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          KEYSTORE_PATH="$RUNNER_TEMP/mrsad-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias mrsad_ambient \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mrsad_ambient_2026 -keypass mrsad_ambient_2026 \
            -dname "CN=MRSAD Ambient, OU=Mobile, O=MRSAD, L=Tehran, S=Tehran, C=IR"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/mrsad-ambient-v1.0.0-release-signed.apk"

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias mrsad_ambient \
            --ks-pass pass:mrsad_ambient_2026 \
            --key-pass pass:mrsad_ambient_2026 \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$SIGNED_APK"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mrsad-ambient-release-signed-apk
          path: mrsad-ambient/app/build/outputs/apk/release/mrsad-ambient-v1.0.0-release-signed.apk
