name: Build MRSAD Ambient APK

on:
  push:
    branches: [ "arena/95094f6c-vodiwalker-panel", "main" ]
    paths:
      - "mrsad-ambient/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "mrsad-ambient/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mrsad-ambient

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mrsad-ambient-apks
          path: |
            mrsad-ambient/app/build/outputs/apk/debug/*.apk
            mrsad-ambient/app/build/outputs/apk/release/*.apk
