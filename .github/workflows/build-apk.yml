name: Build APK

# Builds an installable APK and publishes it to a GitHub Release, giving a
# permanent one-click download:
#
#   https://github.com/mrsad2615-creator/vodiwalker_panel/releases/latest/download/NEUROX-sense-debug.apk
#
# WHY THIS WORKFLOW EXISTS
# The development sandbox cannot reach Google Maven, so Gradle - and therefore an
# APK - was never built there. This runs on GitHub's machines, which can reach
# everything. It is also the only check in this repository that executes the real
# dependency graph: the offline gates compile against hand-written stubs and have
# been wrong in the permissive direction more than once.
#
# The first twelve runs found eleven defects, every one of them invisible to the
# six pre-existing checks. That history is why the failure reporting below is
# thorough: job logs live on a storage host that some clients cannot reach, so
# anything only in the log is effectively lost.
#
# The APK is a DEBUG build: not minified, signed with a per-run throwaway key,
# installs as com.neurox.app.debug beside a release build. That needs no signing
# secrets and cannot be mistaken for a production release. See docs/BUILD.md.

on:
  push:
    branches: [arena/d829ad28-vodiwalker-panel, main]
    paths:
      - 'NEUROX/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'NEUROX/**'
  workflow_dispatch: # rebuild on demand from the Actions tab

permissions:
  contents: write # needed to publish the Release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The hosted runner already has an Android SDK at $ANDROID_HOME. Do NOT use
      # android-actions/setup-android: it re-downloads cmdline-tools and failed on
      # this repository before the build ever started.
      - name: Ensure Android platform 35
        run: |
          set -eu
          test -d "$ANDROID_HOME" || { echo "::error::no Android SDK at ANDROID_HOME"; exit 1; }
          echo "SDK at $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" \
              || { echo "::error::platform 35 installation failed"; exit 1; }
          fi
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A pipeline would report tee's status and a failed build would look green -
      # the exact mistake the old offline audit made - so the exit code is explicit.
      # On failure the compiler's own messages are republished as annotations.
      - name: Assemble
        working-directory: NEUROX
        run: |
          set -o pipefail
          if ./gradlew --no-daemon --console=plain --stacktrace assembleDebug > build.log 2>&1; then
            echo "BUILD SUCCEEDED"
            exit 0
          fi
          echo "=========== BUILD FAILED ==========="
          echo "--- compiler errors ---"
          grep -E "^e: " build.log | head -25 || true
          echo "--- resolution / task failures ---"
          grep -E "Could not resolve|Could not find|What went wrong|FAILURE:|Caused by:" -A2 build.log | head -30 || true
          echo "--- tail ---"
          tail -25 build.log

          emit() {
            sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]\{2,\}/ /g' \
              | grep -v '^$' | head -"${1:-8}" \
              | while IFS= read -r line; do
                  line="$(printf '%s' "$line" | cut -c1-900)"
                  [ -n "$line" ] && echo "::error::$line"
                done
          }
          if grep -q "What went wrong" build.log; then
            sed -n '/What went wrong/,/\* Try/p' build.log | emit 8
          fi
          grep -E "^e: " build.log | emit 6 || true
          grep -iE "out of memory|heap space|duplicate class" build.log | emit 4 || true
          if ! grep -qE "^e: |What went wrong" build.log; then
            tail -12 build.log | emit 8
          fi
          exit 1

      - name: Locate APK
        id: find
        working-directory: NEUROX
        run: |
          set -eu
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          if [ -z "$apk" ]; then
            echo "::error::assembleDebug succeeded but produced no APK"
            find app/build/outputs -type f | head -20
            exit 1
          fi
          # A FIXED asset name keeps the download URL stable across builds.
          name="NEUROX-sense-debug.apk"
          cp "$apk" "$name"
          ls -lh "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$PWD/$name" >> "$GITHUB_OUTPUT"

      # Do not trust assembleDebug's exit code alone: a truncated or unsigned APK
      # would install on nothing, and the failure would reach a phone instead of
      # this run.
      - name: Verify the APK is a real, signed package
        working-directory: NEUROX
        run: |
          set -eu
          apk="${{ steps.find.outputs.name }}"
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          badging=$("$BT/aapt2" dump badging "$apk")
          echo "$badging" | head -6
          echo "$badging" | grep -q "package: name='com.neurox.app.debug'" \
            || { echo "::error::unexpected package id"; exit 1; }
          # build-tools 35 spells this minSdkVersion:'26'; older ones sdkVersion:'26'.
          echo "$badging" | grep -qE "(minSdkVersion|sdkVersion):'26'" \
            || { echo "::error::unexpected minSdk"; echo "$badging" | head -6; exit 1; }
          "$BT/apksigner" verify --verbose "$apk" | head -5
          echo "APK verified: package id, minSdk and signature all as expected."

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurox-sense-debug-apk
          path: NEUROX/${{ steps.find.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      # Publishing via the REST API rather than the gh CLI: inside a workflow the
      # CLI failed with an empty diagnostic, and curl always reports the status and
      # the response body.
      #
      # A publishing failure does NOT fail this job. By this point the APK exists,
      # was verified, and is attached to the run; calling the whole build failed
      # because the last step lacks a permission misrepresents where the problem is.
      - name: Publish release
        if: github.event_name != 'pull_request'
        working-directory: NEUROX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_NAME: ${{ steps.find.outputs.name }}
          APK_PATH: ${{ steps.find.outputs.path }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          api="https://api.github.com/repos/$REPO"
          auth="Authorization: Bearer $GH_TOKEN"
          # The repository has a ruleset that restricts ref creation to certain tag
          # patterns; `apk-latest` was rejected ("Cannot create ref due to creations
          # being restricted") while `neurox-v*` is permitted. A fixed tag name means
          # the ref is reused rather than created again.
          tag="neurox-v1.0.0-debug"

          note_failure() {
            echo "::warning::$1"
            {
              echo "### APK built, not published"
              echo
              echo "The APK was built, verified with aapt2 and apksigner, and attached"
              echo "to this run's artifacts."
              echo
              echo "Publishing needs a \`GITHUB_TOKEN\` with \`contents: write\`."
              echo "Repository Settings -> Actions -> General -> Workflow permissions"
              echo "-> **Read and write permissions**, then re-run this workflow."
              echo
              echo "Cause: $1"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          echo "--- token permissions ---"
          curl -s -H "$auth" "$api" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('repo:', d.get('full_name'), '| perms:', d.get('permissions'))" \
            || echo "could not read repository metadata"

          # Replace any previous release on this tag so /releases/latest is current.
          old_id=$(curl -s -H "$auth" "$api/releases/tags/$tag" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -n "${old_id:-}" ]; then
            echo "deleting previous release $old_id"
            curl -s -o /dev/null -w "  delete release: %{http_code}\n" \
              -X DELETE -H "$auth" "$api/releases/$old_id"
          fi

          cat > notes.md <<NOTES
          Automatic build of \\`$COMMIT\\`.

          **Install:** download \\`$APK_NAME\\` and open it on an Android 8.0+ device. Android will ask you to allow installs from this source.

          - package \\`com.neurox.app.debug\\`; installs beside a release build
          - debug build: not minified, signed with a per-run throwaway key
          - it cannot upgrade over another copy: uninstall the old one first
          - built by GitHub Actions from $COMMIT and verified with aapt2 and apksigner
          - what is and is not tested is in NEUROX/docs/TEST_STATUS.md
          NOTES

          TAG="$tag" python3 - > release.json <<'JSONEOF'
          import json, os
          print(json.dumps({
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ["COMMIT"],
              "name": "NEUROX SENSE - latest APK",
              "body": open("notes.md").read(),
              "draft": False,
              "prerelease": True,
          }))
          JSONEOF

          echo "--- create release ---"
          code=$(curl -s -o resp.json -w "%{http_code}" -X POST -H "$auth" \
                 -H "Accept: application/vnd.github+json" \
                 --data-binary @release.json "$api/releases")
          if [ "$code" != "201" ]; then
            # Show GitHub's own reason, not just the status: a 422 here reads like a
            # permission error but was once a repository ruleset.
            reason=$(python3 -c "
          import json
          try:
              d = json.load(open('resp.json'))
          except Exception:
              print('unreadable response')
              raise SystemExit
          parts = [d.get('message', '')]
          parts += [e.get('message', e.get('code', '')) for e in d.get('errors', [])]
          print(' | '.join(p for p in parts if p))
          " 2>/dev/null || head -c 300 resp.json)
            note_failure "release creation failed with HTTP $code: $reason"
            exit 0
          fi

          upload_url=$(python3 -c "import json; print(json.load(open('resp.json'))['upload_url'].split('{')[0])")
          echo "release created; uploading $APK_NAME"

          ucode=$(curl -s -o up.json -w "%{http_code}" -X POST -H "$auth" \
                  -H "Content-Type: application/vnd.android.package-archive" \
                  --data-binary "@$APK_PATH" "$upload_url?name=$APK_NAME&label=Debug%20APK")
          if [ "$ucode" != "201" ]; then
            note_failure "asset upload failed with HTTP $ucode"
            exit 0
          fi

          size=$(python3 -c "import json; print(json.load(open('up.json'))['size'])")
          echo "uploaded $size bytes"
          echo "::notice::One-click download: https://github.com/$REPO/releases/latest/download/$APK_NAME"
