name: Build TYPFLOW APK

on:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "typflow/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5
          echo "sdk.dir=$ANDROID_HOME" > typflow/local.properties

      - name: Build Debug APK
        working-directory: typflow
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: typflow-apk
          path: typflow/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp typflow/app/build/outputs/apk/debug/app-debug.apk TYPFLOW-1.0.0.apk
          ls -lh TYPFLOW-1.0.0.apk
          gh release view typflow-latest > /dev/null 2>&1 || \
            gh release create typflow-latest \
              --title "TYPFLOW 1.0.0 — APK" \
              --notes "اپلیکیشن TYPFLOW: تمرین تایپ و تندخوانی | نسخه اندروید 8+ (minSdk 26)

          **نصب:** فایل TYPFLOW-1.0.0.apk زیر را دانلود کنید و روی گوشی اندروید نصب کنید (اجازه نصب از منابع نامشخص لازم است)." \
              --prerelease
          gh release upload typflow-latest TYPFLOW-1.0.0.apk --clobber

      - name: Publish build log into repo (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "run: ${{ github.run_number }}"
            echo
            echo "## compile errors"
            echo '```'
            grep -E "(^e: |error:|FAILURE:|Execution failed|Caused by)" /tmp/build.log | head -80 || true
            echo '```'
            echo
            echo "## tail"
            echo '```'
            tail -c 30000 /tmp/build.log || true
            echo '```'
          } > ci-logs/last-build.md 2>/dev/null || { mkdir -p ci-logs; }
          mkdir -p ci-logs
          # rebuild file now that dir exists
          {
            echo "run: ${{ github.run_number }}"
            echo
            echo "## compile errors"
            echo '```'
            grep -E "(^e: |error:|FAILURE:|Execution failed|Caused by)" /tmp/build.log | head -80 || true
            echo '```'
            echo
            echo "## tail"
            echo '```'
            tail -c 30000 /tmp/build.log || true
            echo '```'
          } > ci-logs/last-build.md
          git config user.name "typflow-ci"
          git config user.email "ci@typflow.local"
          git add ci-logs/last-build.md
          git commit -m "ci: build log [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true
