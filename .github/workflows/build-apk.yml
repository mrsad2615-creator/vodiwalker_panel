name: Build TYPFLOW APK

on:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "typflow/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -3
          echo "sdk.dir=$ANDROID_HOME" > typflow/local.properties

      - name: Build Debug APK
        working-directory: typflow
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: typflow-apk
          path: typflow/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp typflow/app/build/outputs/apk/debug/app-debug.apk TYPFLOW-1.0.0.apk
          ls -lh TYPFLOW-1.0.0.apk
          gh release view typflow-latest > /dev/null 2>&1 || \
            gh release create typflow-latest \
              --title "TYPFLOW 1.0.0 — APK" \
              --notes "اپلیکیشن TYPFLOW — تمرین تایپ و تندخوانی. نسخه اندروید ۸ به بالا. فایل TYPFLOW-1.0.0.apk را دانلود و نصب کنید." \
              --prerelease
          gh release upload typflow-latest TYPFLOW-1.0.0.apk --clobber

      - name: Publish build log into repo (on failure)
        if: failure()
        run: |
          mkdir -p ci-logs
          {
            echo "run: ${{ github.run_number }}"
            echo
            echo '## errors'
            echo '```'
            grep -E "(^e: |error:|FAILURE:|Execution failed|Caused by)" /tmp/build.log | head -60 || true
            echo '```'
            echo
            echo '## tail'
            echo '```'
            tail -c 25000 /tmp/build.log || true
            echo '```'
          } > ci-logs/last-build.md
          git config user.name "typflow-ci"
          git config user.email "ci@typflow.local"
          git add ci-logs/last-build.md
          git commit -m "ci: build log [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true

  smoke:
    name: Run app on emulator
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apk
          gh release download typflow-latest --pattern "*.apk" --dir apk --clobber

      - name: Launch on emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: |
            set -x
            adb install -r apk/TYPFLOW-1.0.0.apk
            adb logcat -c
            adb shell am start -n com.typflow.app/.MainActivity
            sleep 7
            adb exec-out screencap -p > shot-01-home.png
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" > diag-window.txt 2>&1
            # tap the app's bottom navigation (second slot) and report result
            SIZE=$(adb shell wm size | grep -o '[0-9]*x[0-9]*' | head -1)
            W=${SIZE%x*}; H=${SIZE#*x}
            echo "screen=$SIZE" >> diag-window.txt
            adb shell input tap $((W * 22 / 100)) $((H - 60)); echo "tap_exit=$?" >> diag-window.txt
            sleep 3
            adb exec-out screencap -p > shot-02-after-tap.png
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml diag-ui.xml > /dev/null 2>&1 || true
            # deep-link screens: guaranteed deterministic screenshots
            for S in typing reading analytics profile settings; do
              adb shell am force-stop com.typflow.app
              adb shell am start -n com.typflow.app/.MainActivity -e screen $S
              sleep 4
              adb exec-out screencap -p > shot-$S.png
            done
            adb logcat -d > emu-logcat.txt
            echo "--- crash check ---"
            if grep -q "FATAL EXCEPTION" emu-logcat.txt; then
              echo "CRASH DETECTED"; grep -A 30 "FATAL EXCEPTION" emu-logcat.txt | head -60; exit 1
            fi
            echo "NO CRASH"

      - name: Commit screenshots to branch
        if: always()
        run: |
          ls -lh shot-*.png 2>/dev/null || true
          mkdir -p telemetry
          rm -f telemetry/*.png
          cp shot-*.png telemetry/ 2>/dev/null || true
          cp diag-window.txt diag-ui.xml telemetry/ 2>/dev/null || true
          tail -c 60000 emu-logcat.txt > telemetry/logcat.txt 2>/dev/null || true
          git config user.name "typflow-ci"
          git config user.email "ci@typflow.local"
          git add telemetry
          git commit -m "ci: emulator screenshots [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true
