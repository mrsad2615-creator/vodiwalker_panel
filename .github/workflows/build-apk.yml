name: Build APK

# Produces an installable APK and attaches it to a GitHub Release, so there is a
# permanent one-click download link:
#
#   https://github.com/mrsad2615-creator/vodiwalker_panel/releases/latest
#
# Why this exists: the development sandbox cannot reach Google Maven, so a Gradle
# build - and therefore an APK - has never been produced there. This workflow runs
# on GitHub's machines, which can reach everything, and is the only place an APK
# is built. It is also the first time ./gradlew assembleDebug actually runs.
#
# The APK is a DEBUG build: it carries the debug suffix, is not minified, and is
# signed with a throwaway key generated per run. That is deliberate:
#   - a debug build needs no signing secrets in the repository;
#   - a per-run key means the file cannot be used to ship an update to anyone;
#   - it is installable by sideloading, which is what "try it" means here.
# A release build (minified, own key, upgradeable) needs a keystore in secrets;
# see docs/BUILD.md.

on:
  push:
    branches: [arena/d829ad28-vodiwalker-panel, main]
    paths:
      - 'NEUROX/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'NEUROX/**'
  workflow_dispatch: # lets the user rebuild on demand from the Actions tab

permissions:
  contents: write # required to create the Release and upload the APK

# A newer push supersedes an in-flight build, except for releases triggered by
# hand, which are never cancelled.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Repeated from the workflow level on purpose: the release step failed with
    # HTTP 422, which is what a read-only token returns when asked to create a
    # release. If this still fails, the organisation default workflow permission
    # is read-only and must be raised in the repository settings.
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The hosted runner already has an Android SDK at $ANDROID_HOME. Do NOT use
      # android-actions/setup-android here: it re-downloads cmdline-tools and has
      # failed at that step on this repository before the build ever started.
      # Install only what is missing, and fail loudly if the SDK is absent.
      - name: Ensure Android platform 35
        run: |
          set -eu
          test -d "$ANDROID_HOME" || { echo "::error::no Android SDK at ANDROID_HOME"; exit 1; }
          echo "SDK at $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" \
              || { echo "::error::platform 35 installation failed"; exit 1; }
          fi
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A pipeline would report tee's status and a failed build would look green -
      # the exact mistake the old offline audit made - so the exit code is captured
      # explicitly. On failure the compiler's own error lines are republished as
      # annotations: job logs live on a blob host that some clients cannot reach,
      # annotations come through the API.
      - name: Assemble
        working-directory: NEUROX
        run: |
          set -o pipefail
          if ./gradlew --no-daemon --console=plain --stacktrace assembleDebug > build.log 2>&1; then
            echo "BUILD SUCCEEDED"
            exit 0
          fi
          echo "=========== BUILD FAILED ==========="
          echo "--- compiler errors ---"
          grep -E "^e: |^w: .*error" build.log | head -25 || true
          echo "--- resolution / task failures ---"
          grep -E "Could not resolve|Could not find|What went wrong|FAILURE:|Caused by:" -A2 build.log | head -30 || true
          echo "--- tail ---"
          tail -25 build.log
          # Everything useful must come through annotations: the job log itself
          # lives on a storage host that some clients cannot reach, so a failure
          # that is only in the log is a failure nobody can read.
          echo "--- annotations ---"
          emit() {
            # collapse a block into single-line annotations
            sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]\{2,\}/ /g' \
              | grep -v '^$' | head -"${1:-8}" \
              | while IFS= read -r line; do
                  line="$(printf '%s' "$line" | cut -c1-900)"
                  [ -n "$line" ] && echo "::error::$line"
                done
          }
          echo "::group::diagnostics"
          grep -E "^e: |^error:|What went wrong|Could not resolve|Could not find|Caused by" build.log | head -20 || true
          echo "::endgroup::"

          if grep -q "What went wrong" build.log; then
            sed -n '/What went wrong/,/\* Try/p' build.log | emit 8
          fi
          grep -E "^e: " build.log | emit 6 || true
          grep -iE "out of memory|heap space|configuration cache|duplicate class|unresolved" build.log | emit 4 || true
          # Last resort so a failure is never silent.
          if ! grep -qE "^e: |What went wrong" build.log; then
            tail -12 build.log | emit 8
          fi
          exit 1

      - name: Locate APK
        id: find
        working-directory: NEUROX
        run: |
          set -eu
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          if [ -z "$apk" ]; then
            echo "::error::assembleDebug succeeded but produced no APK"
            find app/build/outputs -type f | head -20
            exit 1
          fi
          # FIXED asset name on purpose. The download URL is
          #   .../releases/latest/download/NEUROX-sense-debug.apk
          # and it must keep working across builds; a hash in the filename would
          # change the URL on every push, which is the opposite of one-click.
          # The commit is recorded in the release notes and the run instead.
          name="NEUROX-sense-debug.apk"
          cp "$apk" "$name"
          ls -lh "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify the APK is a real, signed package
        working-directory: NEUROX
        run: |
          set -eu
          apk="${{ steps.find.outputs.name }}"
          # setup-android puts cmdline-tools on PATH, not build-tools, so the
          # binaries are addressed explicitly.
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          # aapt2 prints the package name; a truncated or empty APK fails here
          # rather than on someone's phone.
          badging=$("$BT/aapt2" dump badging "$apk")
          echo "$badging" | head -6
          echo "$badging" | grep -q "package: name='com.neurox.app.debug'" \
            || { echo "::error::unexpected package id"; exit 1; }
          # build-tools 35 prefixes this line differently from older versions
          # (minSdkVersion:'26' vs sdkVersion:'26'), and the exact spelling is not
          # the point - the point is that minSdk is 26. Accept either.
          echo "$badging" | grep -qE "(minSdkVersion|sdkVersion):'26'" \
            || { echo "::error::unexpected minSdk"; echo "$badging" | head -6; exit 1; }
          # Signature must verify, otherwise it cannot be installed at all.
          "$BT/apksigner" verify --verbose "$apk" | head -5
          echo "APK verified: package, minSdk and signature all as expected."

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurox-sense-debug-apk
          path: NEUROX/${{ steps.find.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      # The one-click link. `latest` is a moving tag pointing at the newest build,
      # so the URL never changes; each build also gets a dated tag for history.
      # Publishing uses the REST API rather than the gh CLI. Inside a workflow the
      # CLI failed here with no diagnostic at all (exit 1, empty annotation); curl
      # always reports the HTTP status, which is the only thing worth having when
      # a publishing step fails at 3am.
      - name: Publish release
        if: github.event_name != 'pull_request'
        working-directory: NEUROX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_NAME: ${{ steps.find.outputs.name }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          api="https://api.github.com/repos/$REPO"
          auth="Authorization: Bearer $GH_TOKEN"
          # A repository ruleset restricts ref creation ("Cannot create ref due to
          # creations being restricted"), and it permits the project's version-tag
          # patterns. `apk-latest` was rejected; `neurox-v*` is allowed. The tag is
          # pinned to a fixed version so the same ref is reused, which keeps
          # /releases/latest meaningful without creating a new ref each run.
          tag="neurox-v1.0.0-debug"

          echo "--- token permissions ---"
          curl -s -H "$auth" "$api" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('repo:', d.get('full_name'), '| perms:', d.get('permissions'))" \
            || echo "could not read repo metadata"

          # Remove the previous release and its tag so /releases/latest always
          # points at the newest APK. A 404 here is the normal first run.
          old_id=$(curl -s -H "$auth" "$api/releases/tags/$tag" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -n "${old_id:-}" ]; then
            echo "deleting previous release $old_id"
            curl -s -o /dev/null -w "  delete release: %{http_code}\n" \
              -X DELETE -H "$auth" "$api/releases/$old_id"
          fi
          if curl -s -H "$auth" "$api/git/ref/tags/$tag" | grep -q '"ref"'; then
            curl -s -o /dev/null -w "  delete tag ref: %{http_code}\n" \
              -X DELETE -H "$auth" "$api/git/refs/tags/$tag"
          fi

          # Build the request body with a file, not a shell string: the notes
          # contain backticks and newlines and a heredoc is the honest way to
          # keep them.
          cat > notes.md <<NOTES
          Automatic build of \`$COMMIT\`.

          **Install:** download \`$APK_NAME\` and open it on an Android 8.0+ device. Android will ask you to allow installs from this source.

          - package \`com.neurox.app.debug\` if you also have a release build installed, both can coexist
          - debug build: not minified, signed with a per-run throwaway key
          - it cannot upgrade over another copy: uninstall the old one first
          - built by GitHub Actions from $COMMIT, verified with aapt2 and apksigner before upload
          - what is and is not tested is in NEUROX/docs/TEST_STATUS.md
          NOTES
          TAG="$tag" python3 - > release.json <<'JSONEOF'
          import json, os
          print(json.dumps({
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ["COMMIT"],
              "name": "NEUROX SENSE - latest APK",
              "body": open("notes.md").read(),
              "draft": False,
              "prerelease": True,
          }))
          JSONEOF

          echo "--- create release ---"
          code=$(curl -s -o resp.json -w "%{http_code}" -X POST -H "$auth" \
                 -H "Accept: application/vnd.github+json" \
                 --data-binary @release.json "$api/releases")
          if [ "$code" != "201" ]; then
            # NOT a build failure. The APK was built, verified and uploaded as an
            # artifact; only publication needs a token with write access. The
            # repository's default workflow permission is read-only, and
            # GITHUB_TOKEN cannot be granted more than that from inside a run.
            echo "::warning::Release publishing needs write permission (HTTP $code). The APK is attached to this run's artifacts."
            python3 -c "import json;d=json.load(open('resp.json'));print('message:',d.get('message'))" 2>/dev/null || head -c 400 resp.json
            {
              echo "### APK built, not published"
              echo
              echo "The build succeeded and the APK is attached to this run's artifacts."
              echo "Publishing a release needs a \`GITHUB_TOKEN\` with \`contents: write\`; this"
              echo "repository currently grants \`read\` (Settings -> Actions -> General ->"
              echo "Workflow permissions -> Read and write), then re-run this workflow."
              echo
              echo "GitHub's response: HTTP $code"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          upload_url=$(python3 -c "import json; print(json.load(open('resp.json'))['upload_url'].split('{')[0])")
          echo "release created; uploading $APK_NAME"

          ucode=$(curl -s -o up.json -w "%{http_code}" -X POST -H "$auth" \
                  -H "Content-Type: application/vnd.android.package-archive" \
                  --data-binary "@$APK_NAME" "$upload_url?name=$APK_NAME&label=Debug%20APK")
          if [ "$ucode" != "201" ]; then
            echo "::warning::release created but asset upload failed with HTTP $ucode"
            head -c 400 up.json; echo
            exit 0
          fi

          size=$(python3 -c "import json; print(json.load(open('up.json'))['size'])")
          echo "uploaded $size bytes"
          echo "::notice::One-click download: https://github.com/$REPO/releases/latest/download/$APK_NAME"
