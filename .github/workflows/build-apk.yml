name: Build APK

# Builds an installable APK and publishes it to a GitHub Release, giving a
# permanent one-click download:
#
#   https://github.com/mrsad2615-creator/vodiwalker_panel/releases/latest/download/NEUROX-sense-debug.apk
#
# WHY THIS WORKFLOW EXISTS
# The development sandbox cannot reach Google Maven, so Gradle - and therefore an
# APK - was never built there. This runs on GitHub's machines, which can reach
# everything. It is also the only check in this repository that executes the real
# dependency graph: the offline gates compile against hand-written stubs and have
# been wrong in the permissive direction more than once.
#
# The first twelve runs found eleven defects, every one of them invisible to the
# six pre-existing checks. That history is why the failure reporting below is
# thorough: job logs live on a storage host that some clients cannot reach, so
# anything only in the log is effectively lost.
#
# The APK is a DEBUG build: not minified, signed with a per-run throwaway key,
# installs as com.neurox.app.debug beside a release build. That needs no signing
# secrets and cannot be mistaken for a production release. See docs/BUILD.md.

on:
  push:
    branches: [arena/d829ad28-vodiwalker-panel, main]
    paths:
      - 'NEUROX/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'NEUROX/**'
  workflow_dispatch: # rebuild on demand from the Actions tab

permissions:
  contents: write # needed to publish the Release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The hosted runner already has an Android SDK at $ANDROID_HOME. Do NOT use
      # android-actions/setup-android: it re-downloads cmdline-tools and failed on
      # this repository before the build ever started.
      - name: Ensure Android platform 35
        run: |
          set -eu
          test -d "$ANDROID_HOME" || { echo "::error::no Android SDK at ANDROID_HOME"; exit 1; }
          echo "SDK at $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" \
              || { echo "::error::platform 35 installation failed"; exit 1; }
          fi
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A pipeline would report tee's status and a failed build would look green -
      # the exact mistake the old offline audit made - so the exit code is explicit.
      # On failure the compiler's own messages are republished as annotations.
      - name: Assemble
        working-directory: NEUROX
        run: |
          set -o pipefail
          if ./gradlew --no-daemon --console=plain --stacktrace assembleDebug > build.log 2>&1; then
            echo "BUILD SUCCEEDED"
            exit 0
          fi
          echo "=========== BUILD FAILED ==========="
          echo "--- compiler errors ---"
          grep -E "^e: " build.log | head -25 || true
          echo "--- resolution / task failures ---"
          grep -E "Could not resolve|Could not find|What went wrong|FAILURE:|Caused by:" -A2 build.log | head -30 || true
          echo "--- tail ---"
          tail -25 build.log

          emit() {
            sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]\{2,\}/ /g' \
              | grep -v '^$' | head -"${1:-8}" \
              | while IFS= read -r line; do
                  line="$(printf '%s' "$line" | cut -c1-900)"
                  [ -n "$line" ] && echo "::error::$line"
                done
          }
          if grep -q "What went wrong" build.log; then
            sed -n '/What went wrong/,/\* Try/p' build.log | emit 8
          fi
          grep -E "^e: " build.log | emit 6 || true
          grep -iE "out of memory|heap space|duplicate class" build.log | emit 4 || true
          if ! grep -qE "^e: |What went wrong" build.log; then
            tail -12 build.log | emit 8
          fi
          exit 1

      - name: Locate APK
        id: find
        working-directory: NEUROX
        run: |
          set -eu
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          if [ -z "$apk" ]; then
            echo "::error::assembleDebug succeeded but produced no APK"
            find app/build/outputs -type f | head -20
            exit 1
          fi
          # A FIXED asset name keeps the download URL stable across builds.
          name="NEUROX-sense-debug.apk"
          cp "$apk" "$name"
          ls -lh "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$PWD/$name" >> "$GITHUB_OUTPUT"

      # Do not trust assembleDebug's exit code alone: a truncated or unsigned APK
      # would install on nothing, and the failure would reach a phone instead of
      # this run.
      - name: Verify the APK is a real, signed package
        working-directory: NEUROX
        run: |
          set -eu
          apk="${{ steps.find.outputs.name }}"
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          badging=$("$BT/aapt2" dump badging "$apk")
          echo "$badging" | head -6
          echo "$badging" | grep -q "package: name='com.neurox.app.debug'" \
            || { echo "::error::unexpected package id"; exit 1; }
          # build-tools 35 spells this minSdkVersion:'26'; older ones sdkVersion:'26'.
          echo "$badging" | grep -qE "(minSdkVersion|sdkVersion):'26'" \
            || { echo "::error::unexpected minSdk"; echo "$badging" | head -6; exit 1; }
          "$BT/apksigner" verify --verbose "$apk" | head -5
          echo "APK verified: package id, minSdk and signature all as expected."

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurox-sense-debug-apk
          path: NEUROX/${{ steps.find.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      # Publishing to an APK BRANCH, not a Release.
      #
      # The repository blocks tag creation (a ruleset: "Cannot create ref due to
      # creations being restricted") and its releases are immutable, so there is no
      # tag this token can publish to. Branch refs ARE allowed, and a file on a
      # branch is served by raw.githubusercontent.com at a stable URL:
      #
      #   https://raw.githubusercontent.com/OWNER/REPO/apk-latest/NEUROX-sense-debug.apk
      #
      # That is a real one-click download with no tag and no release involved.
      #
      # One API call: the contents endpoint creates the file and, at the same time,
      # the branch. An earlier draft did the blob -> tree -> commit -> ref dance by
      # hand, which is four more places to be wrong for no benefit.
      #
      # A publishing failure does NOT fail this job. By this point the APK exists,
      # was verified, and is attached to the run; reporting the whole build as
      # broken because an optional publishing step failed misstates where the
      # problem is.
      - name: Publish APK to the apk-latest branch
        if: github.event_name != 'pull_request'
        working-directory: NEUROX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_NAME: ${{ steps.find.outputs.name }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          api="https://api.github.com/repos/$REPO"
          auth="Authorization: Bearer $GH_TOKEN"
          branch="apk-latest"

          note_failure() {
            echo "::warning::$1"
            {
              echo "### APK built, not published"
              echo
              echo "The APK was built, verified with aapt2 and apksigner, and is"
              echo "attached to this run's artifacts."
              echo
              echo "Cause: $1"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          echo "--- token permissions ---"
          curl -s -H "$auth" "$api" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('repo:', d.get('full_name'), '| perms:', d.get('permissions'))" \
            || echo "could not read repository metadata"

          # If the branch is new, seed it from this commit so the file has a parent.
          exists=$(curl -s -o /dev/null -w "%{http_code}" -H "$auth" "$api/git/ref/heads/$branch")
          if [ "$exists" != "200" ]; then
            echo "branch $branch does not exist; creating it from $COMMIT"
            code=$(curl -s -o resp.json -w "%{http_code}" -X POST -H "$auth" \
                   -H "Accept: application/vnd.github+json" \
                   -d "{\"ref\":\"refs/heads/$branch\",\"sha\":\"$COMMIT\"}" "$api/git/refs")
            if [ "$code" != "201" ]; then
              note_failure "branch creation failed with HTTP $code"
              head -c 400 resp.json; echo
              exit 0
            fi
          fi

          # The file's sha is needed to replace an existing file; empty means create.
          file_sha=$(curl -s -H "$auth" "$api/contents/$APK_NAME?ref=$branch" \
            | python3 -c "import json,sys
          try:
              print(json.load(sys.stdin).get('sha',''))
          except Exception:
              print('')" 2>/dev/null || true)

          APK_NAME="$APK_NAME" COMMIT="$COMMIT" BRANCH="$branch" FILE_SHA="${file_sha:-}" \
            python3 - > body.json <<'JSONEOF'
          import base64, json, os
          body = {
              "message": "APK " + os.environ["COMMIT"][:7],
              "content": base64.b64encode(open(os.environ["APK_NAME"], "rb").read()).decode(),
              "branch": os.environ["BRANCH"],
          }
          if os.environ.get("FILE_SHA"):
              body["sha"] = os.environ["FILE_SHA"]
          print(json.dumps(body))
          JSONEOF

          echo "--- put $APK_NAME on $branch ($(stat -c%s "$APK_NAME") bytes) ---"
          code=$(curl -s -o resp.json -w "%{http_code}" -X PUT -H "$auth" \
                 -H "Accept: application/vnd.github+json" \
                 --data-binary @body.json "$api/contents/$APK_NAME")
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            reason=$(python3 -c "
          import json
          try:
              d = json.load(open('resp.json'))
          except Exception:
              print('unreadable response'); raise SystemExit
          parts = [d.get('message','')]
          parts += [e.get('message', e.get('code','')) for e in d.get('errors',[])]
          print(' | '.join(p for p in parts if p))
          " 2>/dev/null || head -c 300 resp.json)
            note_failure "upload failed with HTTP $code: $reason"
            exit 0
          fi

          url="https://raw.githubusercontent.com/$REPO/$branch/$APK_NAME"
          echo "::notice::One-click download: $url"
          {
            echo "### APK published"
            echo
            echo "[Download $APK_NAME]($url)"
            echo
            echo "Built from \`$COMMIT\`. This is a direct file link: opening it on"
            echo "an Android device downloads the APK."
          } >> "$GITHUB_STEP_SUMMARY"
