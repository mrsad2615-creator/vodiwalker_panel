name: Build PIRANSHAHR APK

on:
  push:
    branches: ["arena/882a6de7-vodiwalker-panel", "main"]
    paths:
      - "PIRANSHAHR-Android/**"
      - "web-prototype/**"
      - ".github/workflows/build-piranshahr-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Verify Android SDK (preinstalled on ubuntu-latest)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lh $ANDROID_HOME/build-tools/ | head -20
          set -x
          sdkmanager --list_installed 2>&1 | head -40 || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>&1 | head -40
          yes | sdkmanager --licenses 2>&1 | tail -5 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -10 || true
          ls -lh $ANDROID_HOME/build-tools/34.0.0/aapt 2>&1 | head -5
          gradle --version 2>&1 | head -20 || echo "gradle not yet installed"
          java -version 2>&1

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-piranshahr-${{ hashFiles('PIRANSHAHR-Android/**/*.gradle*') }}
          restore-keys: gradle-piranshahr-

      - name: Sync web assets to Android
        run: |
          mkdir -p PIRANSHAHR-Android/app/src/main/assets/www
          if [ -d web-prototype ]; then
            cd web-prototype && npm ci 2>&1 | tail -20 && npm run build 2>&1 | tail -20 && cd ..
            cp -r web-prototype/dist/* PIRANSHAHR-Android/app/src/main/assets/www/ 2>&1 | head -20
          fi
          ls -lh PIRANSHAHR-Android/app/src/main/assets/www/ | head -20
          echo "=== index.html check ==="
          head -20 PIRANSHAHR-Android/app/src/main/assets/www/index.html 2>&1 | head -20

      - name: Build Debug APK (Gradle)
        id: gradle_build
        working-directory: PIRANSHAHR-Android
        continue-on-error: true
        run: |
          set +e
          echo "=== GRADLE BUILD START ==="
          gradle assembleDebug --stacktrace --info 2>&1 | tee /tmp/gradle-build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "=== GRADLE EXIT CODE: $GRADLE_EXIT ==="
          echo "GRADLE_EXIT=$GRADLE_EXIT" >> $GITHUB_ENV
          echo "=== BUILD DIR ==="
          ls -lh app/build/outputs/apk/debug/ 2>&1 | head -20 || find app/build -name "*.apk" 2>&1 | head -20
          # Always print errors inline (visible in job log without blob storage)
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo ""
            echo "========== GRADLE ERRORS (grep) =========="
            grep -i -E "error|failed|exception" /tmp/gradle-build.log | head -100 || true
            echo ""
            echo "========== LAST 120 LINES =========="
            tail -120 /tmp/gradle-build.log || true
            echo ""
          fi
          # Save exit code for next step
          echo "$GRADLE_EXIT" > /tmp/gradle_exit_code.txt
          exit $GRADLE_EXIT

      - name: Expose Gradle Log on Failure (no blob storage needed)
        if: failure() || steps.gradle_build.outcome == 'failure'
        run: |
          echo "### Gradle Build Failed — Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -i -E "error|failed|exception|cause" /tmp/gradle-build.log 2>&1 | head -120 >> $GITHUB_STEP_SUMMARY || echo "(no grep matches)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Last 150 lines" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -150 /tmp/gradle-build.log 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Also print to job log (stdout) for gh api visibility
          echo "========== FULL ERROR CONTEXT (also in Step Summary) =========="
          grep -i -B2 -A2 -E "error|failed|exception" /tmp/gradle-build.log 2>&1 | head -200 || true
          echo "========== TAIL 200 =========="
          tail -200 /tmp/gradle-build.log 2>&1 || true
          # Commit log to repo for sandbox retrieval (allowed host)
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Need to fetch latest before push (in case of race)
          git fetch origin ${{ github.ref_name }} 2>&1 | head -5 || true
          # Copy log to repo root
          if [ -f /tmp/gradle-build.log ]; then
            cp /tmp/gradle-build.log ./gradle-fail-latest.log
            # Truncate to 500KB max for GitHub
            if [ $(stat -c%s ./gradle-fail-latest.log 2>/dev/null || stat -f%z ./gradle-fail-latest.log 2>/dev/null || echo 0) -gt 512000 ]; then
              tail -c 512000 ./gradle-fail-latest.log > ./gradle-fail-latest.log.tmp && mv ./gradle-fail-latest.log.tmp ./gradle-fail-latest.log
            fi
            git add ./gradle-fail-latest.log || true
            git commit -m "diag: gradle log ${{ github.run_id }} [skip ci]" || echo "commit failed or no changes"
            # Use GITHUB_TOKEN for push; retry with rebase if needed
            git pull --rebase origin ${{ github.ref_name }} 2>&1 | head -10 || true
            git push origin HEAD:${{ github.ref_name }} 2>&1 | head -10 || echo "push failed"
          fi
          # Fail the job
          echo "::error::Gradle build failed — see log above and gradle-fail-latest.log"
          exit 1

      - name: Build Release + verify
        working-directory: PIRANSHAHR-Android
        run: |
          gradle assembleRelease --stacktrace 2>&1 | tail -50 || true
          ls -lh app/build/outputs/apk/*/*/*.apk 2>&1 | head -20 || ls -lh app/build/outputs/apk/debug/*.apk 2>&1 | head -20
          echo "--- aapt dump ---"
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk 2>&1 | head -20 || $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging app/build/outputs/apk/debug/app-debug.apk 2>&1 | head -20 || true
          du -h app/build/outputs/apk/debug/app-debug.apk 2>&1

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piranshahr-apk-${{ github.sha }}
          path: |
            PIRANSHAHR-Android/app/build/outputs/apk/**/*.apk
            PIRANSHAHR-Android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: piranshahr-m1-${{ github.run_number }}
          name: "PIRANSHAHR M1 — ${{ github.run_number }}"
          body: |
            PIRANSHAHR — Photorealistic Open-World Driving Simulator (Piranshahr, Iran)
            M1 Vertical Slice — Android APK (POCO X3 Pro target, 30 FPS)

            - WebView + Three.js city (475 GIS features, Peykan hero)
            - Persian RTL (Vazirmatn), offline, Photo Mode
            - Built via Android Gradle on GitHub Actions (JDK17 + SDK34)
          files: PIRANSHAHR-Android/app/build/outputs/apk/debug/app-debug.apk
