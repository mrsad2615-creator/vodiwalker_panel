name: Build PIRANSHAHR APK

on:
  push:
    branches: ["arena/882a6de7-vodiwalker-panel", "main"]
    paths:
      - "PIRANSHAHR-Android/**"
      - "web-prototype/**"
      - ".github/workflows/build-piranshahr-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Verify Android SDK (preinstalled on ubuntu-latest)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -lh $ANDROID_HOME/build-tools/ | head -20
          ls -lh $ANDROID_HOME/cmdline-tools/ | head -20
          set -x
          sdkmanager --list_installed 2>&1 | head -40 || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>&1 | head -40
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          ls -lh $ANDROID_HOME/build-tools/34.0.0/aapt 2>&1 | head -5 || ls -lh $ANDROID_HOME/build-tools/*/aapt 2>&1 | head -5
          # Gradle version check (use wrapper if present, else system)
          gradle --version || echo "no gradle yet"
          java -version

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-piranshahr-${{ hashFiles('PIRANSHAHR-Android/**/*.gradle*') }}
          restore-keys: gradle-piranshahr-

      - name: Make gradlew executable (if present)
        run: |
          if [ -f PIRANSHAHR-Android/gradlew ]; then chmod +x PIRANSHAHR-Android/gradlew; fi
          ls -la PIRANSHAHR-Android/ || true

      - name: Sync web assets to Android
        run: |
          mkdir -p PIRANSHAHR-Android/app/src/main/assets/www
          # Rebuild web if needed (Node already on runner)
          if [ -d web-prototype ]; then
            cd web-prototype && npm ci && npm run build && cd ..
            cp -r web-prototype/dist/* PIRANSHAHR-Android/app/src/main/assets/www/
          fi
          ls -lh PIRANSHAHR-Android/app/src/main/assets/www/ | head -20

      - name: Build Debug APK (Gradle)
        working-directory: PIRANSHAHR-Android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --info 2>&1 | tee /tmp/gradle-build.log | tail -300
          echo "=== BUILD RESULT ==="
          ls -lh app/build/outputs/apk/debug/*.apk 2>&1 || find app/build -name "*.apk" 2>&1 | head -20
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "=== GRADLE BUILD LOG (last 800 lines) ==="
            tail -800 /tmp/gradle-build.log || true
            echo "=== GRADLE LOG GREP ERRORS ==="
            grep -i -E "error|failed|exception|cause" /tmp/gradle-build.log | head -100 || true
            exit 1
          fi

      - name: Upload Gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ github.run_id }}
          path: /tmp/gradle-build.log
          retention-days: 5
          if-no-files-found: warn

      - name: Build Release + verify
        working-directory: PIRANSHAHR-Android
        run: |
          gradle assembleRelease --stacktrace || true
          ls -lh app/build/outputs/apk/*/*/*.apk || ls -lh app/build/outputs/apk/debug/*.apk
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -20 || $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging app/build/outputs/apk/debug/app-debug.apk | head -20 || true
          du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piranshahr-apk-${{ github.sha }}
          path: |
            PIRANSHAHR-Android/app/build/outputs/apk/**/*.apk
            PIRANSHAHR-Android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: piranshahr-m1-${{ github.run_number }}
          name: "PIRANSHAHR M1 — ${{ github.run_number }}"
          body: |
            PIRANSHAHR — Photorealistic Open-World Driving Simulator (Piranshahr, Iran)
            M1 Vertical Slice — Android APK (POCO X3 Pro target, 30 FPS)

            - WebView + Three.js city (475 GIS features, Peykan hero)
            - Persian RTL (Vazirmatn), offline, Photo Mode
            - Built via Android Gradle on GitHub Actions (JDK17 + SDK34)
          files: PIRANSHAHR-Android/app/build/outputs/apk/debug/app-debug.apk
