name: Build PIRANSHAHR APK

on:
  push:
    branches: ["arena/882a6de7-vodiwalker-panel", "main"]
    paths:
      - "PIRANSHAHR-Android/**"
      - "web-prototype/**"
      - ".github/workflows/build-piranshahr-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-piranshahr-${{ hashFiles('PIRANSHAHR-Android/**/*.gradle*') }}
          restore-keys: gradle-piranshahr-

      - name: Make gradlew executable (if present)
        run: |
          if [ -f PIRANSHAHR-Android/gradlew ]; then chmod +x PIRANSHAHR-Android/gradlew; fi
          ls -la PIRANSHAHR-Android/ || true

      - name: Sync web assets to Android
        run: |
          mkdir -p PIRANSHAHR-Android/app/src/main/assets/www
          # Rebuild web if needed (Node already on runner)
          if [ -d web-prototype ]; then
            cd web-prototype && npm ci && npm run build && cd ..
            cp -r web-prototype/dist/* PIRANSHAHR-Android/app/src/main/assets/www/
          fi
          ls -lh PIRANSHAHR-Android/app/src/main/assets/www/ | head -20

      - name: Build Debug APK (Gradle)
        working-directory: PIRANSHAHR-Android
        run: |
          # Use Gradle directly (no wrapper jar needed - setup-java + gradle action provides it)
          # Install Gradle 8.7 via SDKMAN fallback if wrapper missing
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            # Install Gradle 8.7
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            export PATH=/tmp/gradle-8.7/bin:$PATH
            gradle assembleDebug --stacktrace
          fi

      - name: Build Release (unsigned) + verify
        working-directory: PIRANSHAHR-Android
        run: |
          export PATH=/tmp/gradle-8.7/bin:$PATH
          gradle assembleRelease --stacktrace || true
          ls -lh app/build/outputs/apk/*/*/*.apk || ls -lh app/build/outputs/apk/debug/*.apk
          # Show APK info
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -20 || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piranshahr-apk-${{ github.sha }}
          path: |
            PIRANSHAHR-Android/app/build/outputs/apk/**/*.apk
            PIRANSHAHR-Android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: piranshahr-m1-${{ github.run_number }}
          name: "PIRANSHAHR M1 — ${{ github.run_number }}"
          body: |
            PIRANSHAHR — Photorealistic Open-World Driving Simulator (Piranshahr, Iran)
            M1 Vertical Slice — Android APK (POCO X3 Pro target, 30 FPS)

            - WebView + Three.js city (475 GIS features, Peykan hero)
            - Persian RTL (Vazirmatn), offline, Photo Mode
            - Built via Android Gradle on GitHub Actions (JDK17 + SDK34)
          files: PIRANSHAHR-Android/app/build/outputs/apk/debug/app-debug.apk
