name: ci-probe
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain
        run: |
          java -version 2>&1 | head -3
          echo "---"
          echo "runner ok: $(uname -sr)"
