name: mrsad Android

on:
  push:
    paths:
      - 'dana-android/**'
      - '.github/workflows/dana-android.yml'
  pull_request:
    paths:
      - 'dana-android/**'
      - '.github/workflows/dana-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dana-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    defaults:
      run:
        working-directory: dana-android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Verify Android SDK, install packages only if missing
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -f "$sdk/platforms/android-36/android.jar" || ! -x "$sdk/build-tools/36.0.0/apksigner" ]]; then
            manager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
            if [[ ! -x "$manager" ]]; then
              echo '::error title=Android SDK::API 36 or Build Tools 36.0.0 is missing and sdkmanager was not found.'
              exit 1
            fi
            "$manager" --sdk_root="$sdk" 'platforms;android-36' 'build-tools;36.0.0'
          fi
          printf 'ANDROID_HOME=%s\n' "$sdk" >> "$GITHUB_ENV"
      - name: Provision and verify pinned offline model weights
        run: python3 ci/bundled-models.py
      - name: Test, lint and assemble
        shell: bash
        run: |
          if ./gradlew --no-daemon --console=plain :core:domain:test :core:data:testDebugUnitTest :core:data:lintDebug :core:data:assembleDebugAndroidTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/dana-gradle.log"; then
            exit 0
          fi
          python3 - "$RUNNER_TEMP/dana-gradle.log" <<'PYTHON'
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          diagnostics = [line for line in lines if line.lstrip().startswith(('e:', 'Caused by:', '* What went wrong'))
                         or 'Error:' in line or 'FAILED' in line or line.startswith(('> Lint', '> Could not', '> Execution failed'))]
          for index, line in enumerate(lines):
              if line.startswith(('* What went wrong:', '* Where:')):
                  diagnostics.extend(lines[index:index + 13])
              if ' > ' in line and 'FAILED' in line:
                  diagnostics.extend(lines[index:index + 4])
          for report in Path('.').glob('**/build/reports/lint-results-debug.txt'):
              diagnostics.extend(line for line in report.read_text(errors='replace').splitlines() if 'Error:' in line)
          message = '\n'.join(dict.fromkeys(diagnostics or lines[-30:]))[:6200]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Dana Gradle build failed::{message}')
          PYTHON
          exit 1
      - name: Check the generated Room schema
        if: always()
        shell: bash
        run: |
          schema=core/data/schemas/ai.dana.data.local.DanaDatabase/1.json
          if [[ -f "$schema" ]]; then
            if git ls-files --error-unmatch "$schema" > /dev/null 2>&1; then
              git diff --exit-code -- "$schema"
            else
              encoded=$(base64 -w0 "$schema")
              for ((offset=0; offset < ${#encoded}; offset+=2800)); do
                printf '::notice title=Dana Room v1 schema part %d::%s\n' "$((offset/2800+1))" "${encoded:offset:2800}"
              done
            fi
          elif [[ '${{ job.status }}' == success ]]; then
            echo '::error title=Room schema::Room did not export the v1 schema.'
            exit 1
          fi
      - name: Verify JVM test counts and APK signature
        id: verify
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import os

          for module, task, minimum in [('core/domain', 'test', 48), ('core/data', 'testDebugUnitTest', 30)]:
              reports = list((Path(module) / 'build/test-results' / task).glob('TEST-*.xml'))
              tests = [case for report in reports for case in ET.parse(report).iter('testcase')]
              if len(tests) < minimum or any(case.find('skipped') is not None or case.find('failure') is not None or case.find('error') is not None for case in tests):
                  raise SystemExit(f'::error title=Dana JVM tests::{module} did not execute at least {minimum} passing tests.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  print(f'- {module}: {len(tests)} JVM tests passed.', file=out)
          PYTHON
          mkdir -p "$RUNNER_TEMP/dana-verified"
          apk="$RUNNER_TEMP/dana-verified/mrsad-preview.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          cmp LICENSE app/src/main/assets/licenses/mrsad-MIT.txt
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          python3 ci/check-native-alignment.py "$apk"
          python3 ci/bundled-models.py --apk "$apk"
          badging=$("$tools/aapt" dump badging "$apk")
          grep -Fq "package: name='ai.dana.mrsad.models' versionCode='9' versionName='0.9.0-preview'" <<< "$badging"
          digest=$(sha256sum "$apk" | cut -d' ' -f1)
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '\nSHA-256: `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Enable hardware acceleration for the Android emulator
        shell: bash
        run: |
          test -c /dev/kvm || { echo '::error title=Android emulator::KVM is unavailable on the runner.'; exit 1; }
          sudo chmod a+rw /dev/kvm
      - name: Test storage, native OCR and the installed app on Android
        timeout-minutes: 17
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          # The app and tests do not depend on Play services. The Google APIs image
          # produced a Pixel Launcher ANR overlay that blocked the UI smoke test.
          target: default
          profile: pixel_2
          emulator-boot-timeout: 210
          # ANGLE/SwiftShader avoids the headless emulator's GLES ColorBuffer
          # failures with the native and guest renderer paths. Keep VM logs for diagnosis.
          emulator-options: >-
            -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -cores 2 -memory 3072
            > $RUNNER_TEMP/dana-emulator-host.log 2>&1
          working-directory: dana-android
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/dana-android/ci/test-emulator.sh"
      - name: Report emulator failures
        if: failure()
        shell: bash
        run: |
          sudo dmesg | grep -Ei 'out of memory|killed process|segfault|qemu.*(trap|fault)' | tail -n 12 > "$RUNNER_TEMP/dana-emulator-kernel.log" || true
          python3 - "$RUNNER_TEMP" <<'PYTHON'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          progress = root / 'dana-device-progress.txt'
          log = root / 'dana-instrumentation.log'
          host = root / 'dana-emulator-host.log'
          if not progress.exists() and not host.exists():
              raise SystemExit(0)
          lines = log.read_text(errors='replace').splitlines() if log.exists() else []
          important = [line for line in lines if line.startswith(('Error:', 'FAILURES', 'Caused by:', 'FATAL EXCEPTION')) or 'Exception:' in line or 'AssertionError' in line or 'failed' in line.lower()]
          report = (progress.read_text(errors='replace') if progress.exists() else 'Emulator did not reach the test script.') + '\n' + '\n'.join(dict.fromkeys(important[:12] + lines[-18:]))[:2900]
          milestones = [line for line in lines if line.startswith('mrsad: ')]
          if milestones:
              print('::notice title=mrsad device milestones::' + '%0A'.join(milestones).replace('\r', '')[:2800])
          def annotate(title, report):
              print(f'::error title={title}::' + report[:3900].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          annotate('Dana Android test trace', report)
          guest = root / 'dana-emulator-guest.log'
          if guest.exists():
              guest_lines = guest.read_text(errors='replace').splitlines()
              annotate('Dana Android guest trace', '\n'.join(guest_lines[-32:]))
          if host.exists():
              host_lines = host.read_text(errors='replace').splitlines()
              kernel = (root / 'dana-emulator-kernel.log').read_text(errors='replace')
              annotate('Dana emulator host trace', kernel + '\n' + '\n'.join(host_lines[-25:]))
          PYTHON
      - name: Keep the built APK as an explicitly unverified debug artifact on test failure
        if: failure() && steps.verify.conclusion == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mrsad-0.9-debug-device-tests-not-passed
          path: ${{ runner.temp }}/dana-verified/mrsad-preview.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload the APK without a ZIP wrapper
        id: apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/dana-verified/mrsad-preview.apk
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Save emulator screenshots of the new UI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mrsad-0.9-Android-screens
          path: ${{ runner.temp }}/dana-screens/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Link the APK
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: printf '\n[Download mrsad APK](%s)\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"

  apple-bridge:
    name: Verify private Mac bridge protocol (no Apple model)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: dana-android/companion/apple-mac
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test protocol, TLS and worker cleanup
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/dana-bridge"
          python="$RUNNER_TEMP/dana-bridge/bin/python"
          "$python" -m pip install --disable-pip-version-check -r requirements-server.txt
          "$python" -m unittest discover -s tests -v
          printf '\nMac bridge transport and protocol passed on Linux; Apple inference needs a compatible Mac.\n' >> "$GITHUB_STEP_SUMMARY"

  email-otp:
    name: Verify email OTP against local Supabase Auth and SMTP sink
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Exercise real email registration, verification and revocation with synthetic data
        shell: bash
        run: bash dana-android/ci/email-otp/run.sh

  publish:
    name: Publish the tested preview APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/13014174-vodiwalker-panel' && contains(github.event.head_commit.message, '[dana-apk]')
    needs: [build, apple-bridge, email-otp]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mrsad-preview.apk
          path: ${{ runner.temp }}/dana-publish
          skip-decompress: true
      - name: Publish with a direct download link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          cd "$RUNNER_TEMP/dana-publish"
          printf '%s  mrsad-preview.apk\n' "$VERIFIED_SHA256" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          tag="mrsad-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" mrsad-preview.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "mrsad 0.9 Android preview (${GITHUB_SHA:0:8})" --prerelease --latest=false \
            --notes "Tested Android preview for $GITHUB_SHA. Debug-signed (ai.dana.mrsad.models), installs beside 0.8, not a production or Play Store build. Includes real Qwen3 and SmolLM2 weights (64-bit devices, extra storage for local initialization) and no shared credentials. The exact APK runs both models in airplane mode on x86_64 Android 35. Optional OpenRouter browser sign-in and free catalog have no paid fallback. Native Phone uses standard Android intents. Account exchange, online text/image responses and external activity/picker results are fixture-tested; live accounts, regional access, external email delivery and physical hardware are not verified. Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          printf '\n[Download mrsad APK](%s/%s/releases/download/%s/mrsad-preview.apk)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
