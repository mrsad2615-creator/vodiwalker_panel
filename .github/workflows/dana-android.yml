name: Dana Android

on:
  push:
    paths:
      - 'dana-android/**'
      - '.github/workflows/dana-android.yml'
  pull_request:
    paths:
      - 'dana-android/**'
      - '.github/workflows/dana-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dana-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: dana-android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and assemble
        run: ./gradlew --no-daemon --stacktrace :core:domain:test :core:data:lintDebug :core:data:assembleDebugAndroidTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Verify the installable APK
        run: |
          mkdir -p "$RUNNER_TEMP/dana-verified"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/dana-verified/DANA-AI-preview.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/dana-verified/DANA-AI-preview.apk"
          sha256sum "$RUNNER_TEMP/dana-verified/DANA-AI-preview.apk" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the APK without a ZIP wrapper
        id: apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/dana-verified/DANA-AI-preview.apk
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Link the APK
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: printf '\n[Download DANA AI APK](%s)\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"
