name: HGallery Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'hgallery/**'
      - '.github/workflows/hgallery-android.yml'
      - '.github/scripts/annotate.py'

permissions:
  contents: read

concurrency:
  group: hgallery-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  core-tests:
    name: Domain core (pure Kotlin tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgallery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make the wrapper executable
        run: chmod +x ./gradlew
      - name: Core unit tests
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon :core:test 2>&1 | tee core.log
      # Echo the whole log when it is short: a configuration failure produces a
      # handful of lines and the cause is often one that matches no keyword.
      - name: Report failure details
        if: failure() || cancelled()
        shell: bash
        run: |
          set -uo pipefail
          if [ -f core.log ] && [ "$(wc -l < core.log)" -lt 120 ]; then
            while IFS= read -r line; do
              echo "::error title=core::$line"
            done < core.log
          else
            python3 ../.github/scripts/annotate.py core.log "core tests"
          fi
      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hgallery-core-reports
          path: |
            hgallery/core/build/reports/tests/test/**
            hgallery/core/build/test-results/**
          if-no-files-found: ignore

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: core-tests
    defaults:
      run:
        working-directory: hgallery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make the wrapper executable
        run: chmod +x ./gradlew
      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon :app:assembleDebug 2>&1 | tee build.log
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon :app:testDebugUnitTest 2>&1 | tee -a build.log
      - name: Lint
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon :app:lintDebug 2>&1 | tee -a build.log
      # The lint text report is the only complete record of what lint objected
      # to. It is echoed line by line as annotations because neither the raw log
      # nor the uploaded artefact can be fetched from every environment.
      - name: Report lint findings
        if: failure() || cancelled()
        shell: bash
        run: |
          set -uo pipefail
          REPORT=app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            grep -nE "Error:|Warning:" "$REPORT" | head -60 | while IFS= read -r line; do
              echo "::error title=lint::$line"
            done
          else
            echo "::warning title=lint::no lint text report was produced"
          fi
      - name: Report failure details
        if: failure() || cancelled()
        shell: bash
        run: python3 ../.github/scripts/annotate.py build.log "app build"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hgallery-debug-apk
          path: hgallery/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hgallery-reports
          path: |
            hgallery/app/build/reports/**
            hgallery/app/build/test-results/**
          if-no-files-found: ignore

  e2e:
    name: Emulator run, UI tests and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    # Needed so the screenshots can be committed back to the branch: workflow
    # artefacts are not retrievable from every environment, but a file in the
    # repository always is.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # The instrumentation test builds its own test APK; the *application* has
      # to be installed separately for the app to be launched and photographed.
      - name: Fetch the debug APK built by the previous job
        uses: actions/download-artifact@v4
        with:
          name: hgallery-debug-apk
          path: hgallery/apk
      - name: Confirm the APK arrived
        shell: bash
        run: |
          set -uo pipefail
          echo "::notice title=apk::$(find hgallery/apk -type f | head -5 | tr '\n' ' ')"
          find hgallery/apk -type f -exec ls -l {} \; || echo "::warning title=apk::nothing downloaded"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 600
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          # Kept as a single command: the runner passes `script` straight to
          # `sh -c`, and a multi-line block mixed up the shell it used.
          script: cd hgallery && chmod +x .ci/run-connected-tests.sh && sh .ci/run-connected-tests.sh
      - name: Report what the emulator produced
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ -d hgallery/ui-shots ]; then
            find hgallery/ui-shots -type f | head -20 | while IFS= read -r f; do
              echo "::notice title=e2e::produced $f"
            done
          else
            echo "::warning title=e2e::the harness produced no ui-shots directory"
          fi
      - name: Report instrumented test failures
        if: failure() || cancelled()
        shell: bash
        run: python3 .github/scripts/annotate.py hgallery/ui-test.log "ui tests"
      # Publishing the shots into the branch is what makes the visual review
      # possible at all: the reviewer can open the exact PNG the emulator drew.
      # `[skip ci]` keeps the commit from starting another build of itself.
      - name: Publish screenshots to the branch
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ ! -d hgallery/ui-shots ]; then
            echo "::warning title=screenshots::no screenshots were produced"
            exit 0
          fi
          git config user.name "hgallery-ci"
          git config user.email "ci@users.noreply.github.com"
          rm -rf hgallery/evidence
          mkdir -p hgallery/evidence
          find hgallery/ui-shots -name "*.png" -exec cp {} hgallery/evidence/ ';' 2>/dev/null || true
          cp hgallery/ui-shots/diag/*.txt hgallery/evidence/ 2>/dev/null || true
          git add -A hgallery/evidence
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
            exit 0
          fi
          git commit -q -m "chore(evidence): refresh emulator screenshots [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hgallery-screenshots
          path: |
            hgallery/ui-shots/**
            hgallery/ui-test.log
            hgallery/app/build/reports/androidTests/**
          if-no-files-found: ignore

  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [core-tests, build]
    permissions:
      contents: write
    defaults:
      run:
        working-directory: hgallery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # The key lives in the Actions cache, never in the repository. Caching it
      # instead of generating one per run keeps the signing identity stable,
      # which is what lets a new APK install over an old one without the user
      # losing anything. A repository secret wins when one exists.
      - name: Restore the signing key
        id: keystore
        uses: actions/cache@v4
        with:
          path: hgallery/.keystore
          key: hgallery-release-keystore-v1

      - name: Write the stored signing key
        if: env.HG_KEYSTORE_BASE64 != ''
        shell: bash
        working-directory: hgallery
        env:
          HG_KEYSTORE_BASE64: ${{ secrets.HG_KEYSTORE_BASE64 }}
          HG_KEYSTORE_PASSWORD: ${{ secrets.HG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .keystore
          printf '%s' "$HG_KEYSTORE_BASE64" | base64 -d > .keystore/hgallery-release.jks
          printf '%s' "$HG_KEYSTORE_PASSWORD" > .keystore/password.txt

      - name: Create the signing key
        if: steps.keystore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .keystore
          PASS=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | cut -c1-40)
          printf '%s' "$PASS" > .keystore/password.txt
          keytool -genkeypair -v \
            -keystore .keystore/hgallery-release.jks \
            -alias hgallery \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=HGallery, OU=Personal, O=HGallery, C=DE"

      - name: Build the signed release APK
        shell: bash
        run: |
          set -euo pipefail
          PASS=$(cat .keystore/password.txt)
          export ORG_GRADLE_PROJECT_HG_KEYSTORE="$GITHUB_WORKSPACE/hgallery/.keystore/hgallery-release.jks"
          export ORG_GRADLE_PROJECT_HG_KEYSTORE_PASSWORD="$PASS"
          export ORG_GRADLE_PROJECT_HG_KEY_ALIAS="hgallery"
          export ORG_GRADLE_PROJECT_HG_KEY_PASSWORD="$PASS"
          ./gradlew --console=plain --no-daemon :app:assembleRelease

      - name: Verify the APK is signed and well formed
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apk: $APK"
          ls -l "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | head -8
          "$BT/apksigner" verify --print-certs "$APK" | head -6
          sha256sum "$APK" | tee SHA256SUMS.txt

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.run_number }}
        run: |
          set -uo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" hgallery.apk
          TAG="hgallery-v0.1.${VERSION}"
          {
            echo "HGallery — a personal, local-only recreation of Huawei Gallery."
            echo
            echo "* Real MediaStore access with scoped-storage permissions."
            echo "* Photos timeline grouped by day (Today / Yesterday / date), seamless 4-column grid."
            echo "* Month view with six columns and month headers, switched by pinching or by the"
            echo "  toolbar control \u2014 the behaviour Huawei's own Gallery manual describes."
            echo "* Albums with 2x2 mosaic covers, counts, MORE ALBUMS, and a detail screen."
            echo "* Instrumented Compose tests on an emulator: navigation, album drill-down,"
            echo "  Persian strings, month/day switching. Screenshots of every screen are"
            echo "  committed under hgallery/evidence/."
            echo "* Full-screen viewer with pinch and double-tap zoom, paged swiping, favourites and delete."
            echo "* Persian (RTL) and English strings, both selected by the platform."
            echo "* Light and dark palettes; the light theme is the one measured against the reference."
            echo "* No INTERNET permission: nothing leaves the device."
            echo
            echo "Commit \`${GITHUB_SHA:0:7}\` · CI run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Install \`hgallery.apk\` on Android 8.0+ (allow installs from unknown sources)."
            echo "Verify the download against \`SHA256SUMS.txt\`."
            echo
            echo "The signing key must not change between releases: Android refuses to"
            echo "install a build over an older one when the signature differs."
          } > notes.md
          gh release create "$TAG" hgallery.apk SHA256SUMS.txt \
            --title "HGallery 0.1.$VERSION" --notes-file notes.md
