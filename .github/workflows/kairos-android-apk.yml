name: Build KAIROS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'kairos-app/**'
      - '.github/workflows/kairos-android-apk.yml'

permissions:
  contents: write

concurrency:
  group: kairos-apk
  cancel-in-progress: true

env:
  VERSION: '1.3.4'
  TAG: 'kairos-v1.3.4'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kairos-app/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Debug builds are signed with ~/.android/debug.keystore, which Gradle
      # creates fresh on every runner. Caching it keeps ONE signing identity
      # across builds, so a newer APK installs over the previous one.
      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kairos-debug-keystore-v1

      - name: Quality gates (typecheck, lint, tests)
        working-directory: kairos-app
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test

      - name: Build web bundle and sync Capacitor
        working-directory: kairos-app
        env:
          KAIROS_BUILD_SHA: ${{ github.sha }}
          KAIROS_BUILD_NUMBER: ${{ github.run_number }}
          KAIROS_BUILD_TIME: ${{ github.event.head_commit.timestamp || '' }}
        run: |
          npm run build
          npx cap sync android

      # Every build gets its own file name (version + build number + short sha)
      # so the download URL is never the same twice — no stale browser or CDN
      # cache handing back an older APK, and the name on the phone tells you
      # exactly which build you installed.
      - name: Assemble APK
        working-directory: kairos-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_FILE="KAIROS-${VERSION}-b${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          mkdir -p ../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "../artifacts/${BUILD_FILE}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "../artifacts/KAIROS-v${VERSION}.apk"
          ls -lh ../artifacts/
          echo "BUILD_FILE=${BUILD_FILE}" >> "$GITHUB_ENV"
          {
            echo "### KAIROS ${VERSION} · build ${GITHUB_RUN_NUMBER} · ${SHORT_SHA}"
            echo ""
            echo '```'
            sha256sum "../artifacts/${BUILD_FILE}.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "../artifacts/${BUILD_FILE}.apk" | head -4 || true
            unzip -l "../artifacts/${BUILD_FILE}.apk" | tail -3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS-${{ env.VERSION }}-b${{ github.run_number }}
          path: kairos-app/artifacts/*.apk
          if-no-files-found: error

      # One release per build (tag = kairos-v<version>-b<run>). The create path is
      # the reliable one, and it gives every build an immutable, unique URL — no
      # overwriting a shared asset, no stale download.
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUILD_TAG="kairos-v${VERSION}-b${GITHUB_RUN_NUMBER}"
          REPO="$GITHUB_REPOSITORY"
          UNIQUE="kairos-app/artifacts/${BUILD_FILE}.apk"
          STABLE="kairos-app/artifacts/KAIROS-v${VERSION}.apk"
          ls -lh kairos-app/artifacts/
          if gh release view "$BUILD_TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "release $BUILD_TAG exists → uploading"
            gh release upload "$BUILD_TAG" "$UNIQUE" --clobber --repo "$REPO"
            gh release upload "$BUILD_TAG" "$STABLE" --clobber --repo "$REPO"
          else
            echo "creating release $BUILD_TAG"
            gh release create "$BUILD_TAG" "$UNIQUE" "$STABLE" \
              --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "KAIROS ${VERSION} · build ${GITHUB_RUN_NUMBER}" \
              --notes "نسخهٔ ${VERSION} — بیلد ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}). فایل نام‌گذاری‌شده با شمارهٔ بیلد یکتاست؛ KAIROS-v${VERSION}.apk همان بیلد با نام ثابت است."
          fi
          {
            echo ""
            echo "**دانلود:** https://github.com/$REPO/releases/download/$BUILD_TAG/${BUILD_FILE}.apk"
            echo ""
            echo "**لینک ثابت:** https://github.com/$REPO/releases/download/$BUILD_TAG/KAIROS-v${VERSION}.apk"
          } >> "$GITHUB_STEP_SUMMARY"
