name: MESAD verification

on:
  push:
    paths:
      - 'mesad-android/**'
      - 'mesad-studio/**'
      - '.github/workflows/mesad-android-ci.yml'
  pull_request:
    paths:
      - 'mesad-android/**'
      - 'mesad-studio/**'
      - '.github/workflows/mesad-android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK tools
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$sdkmanager_path" ]]; then
            echo "sdkmanager not found under $sdk_root/cmdline-tools"
            ls -la "$sdk_root" || true
            exit 1
          fi
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdkmanager_path" --version
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run JVM unit tests and assemble APK
        working-directory: mesad-android
        shell: bash
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/mesad-gradle.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for case in root.findall('.//testcase'):
                  failure = case.find('failure')
                  if failure is not None:
                      detail = (failure.get('message') or failure.text or 'test failed').replace('\\n', ' ')[:1200]
                      print(f"::error::FAIL {case.get('classname')}.{case.get('name')}: {detail}")
          PYTEST
            sed -n '/What went wrong:/,/^\* Try:/p' "$RUNNER_TEMP/mesad-gradle.log" | head -80 | while IFS= read -r line; do echo "::error::$line"; done
            grep -Ei '^(e: |FAILURE:|Execution failed for task|Could not resolve|Could not find)|requires.*compile|compileSdk|compile SDK|AAR metadata|must compile' "$RUNNER_TEMP/mesad-gradle.log" | head -100 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: mesad-debug-apk
          path: mesad-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  web:
    name: WebGL studio tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesad-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mesad-studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
