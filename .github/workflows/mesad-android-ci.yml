name: MESAD verification

on:
  push:
    paths:
      - 'mesad-android/**'
      - 'mesad-studio/**'
      - '.github/workflows/mesad-android-ci.yml'
  pull_request:
    paths:
      - 'mesad-android/**'
      - 'mesad-studio/**'
      - '.github/workflows/mesad-android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --version
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run JVM unit tests and assemble APK
        working-directory: mesad-android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mesad-debug-apk
          path: mesad-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  web:
    name: WebGL studio tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesad-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mesad-studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
