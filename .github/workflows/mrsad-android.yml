name: MRSAD Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'mrsad/**'
      - '.github/workflows/mrsad-android.yml'

permissions:
  contents: read

concurrency:
  group: mrsad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Domain core (pure Kotlin tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mrsad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Core unit tests
        run: ./gradlew --console=plain --no-daemon :core:test

  build:
    name: Build & test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: core-tests
    defaults:
      run:
        working-directory: mrsad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile, lint and unit-test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon \
            :app:assembleDebug \
            :app:testDebugUnitTest \
            :app:lintDebug 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            echo "--- compiler errors ---"
            grep -E '(^e:|^w: .*error|error:|FAILURE|Caused by|> Task .*FAILED)' "$RUNNER_TEMP/build.log" | head -80
            python3 - <<'PY'
          import os, pathlib
          log = pathlib.Path(os.environ["RUNNER_TEMP"], "build.log")
          text = log.read_text(errors="replace")
          # Surface only the actionable region (first compiler error → next 60 lines)
          marker = text.find("e: file://")
          chunk = text[marker:marker + 6000] if marker >= 0 else text[-4000:]
          chunk = chunk.replace("%", "%25").replace("\n", "%0A").replace("\r", "")
          print(f"::error title=MRSAD build failure::{chunk}")
          PY
            exit 1
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mrsad-debug-apk
          path: mrsad/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrsad-reports
          path: |
            mrsad/core/build/reports/tests/test/**
            mrsad/app/build/reports/**
            mrsad/app/build/test-results/**
          if-no-files-found: ignore

  e2e:
    name: Emulator smoke test (offline boot)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          emulator-boot-timeout: 420
          disable-animations: true
          script: cd mrsad && ./gradlew --console=plain --no-daemon :app:connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrsad-androidtest-reports
          path: mrsad/app/build/reports/androidTests/**
          if-no-files-found: ignore
