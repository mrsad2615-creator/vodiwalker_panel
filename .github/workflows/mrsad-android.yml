name: MRSAD Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'mrsad/**'
      - '.github/workflows/mrsad-android.yml'

permissions:
  contents: read

concurrency:
  group: mrsad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Domain core (pure Kotlin tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mrsad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Core unit tests
        run: ./gradlew --console=plain --no-daemon :core:test

  build:
    name: Build & test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: core-tests
    defaults:
      run:
        working-directory: mrsad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon :app:assembleDebug 2>&1 | tee build.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon :app:testDebugUnitTest 2>&1 | tee -a build.log

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon :app:lintDebug 2>&1 | tee -a build.log

      - name: Report failure details
        if: failure()
        run: |
          echo "----- last 80 lines -----"
          tail -80 build.log || true
          echo "----- errors -----"
          grep -nE '^(e: |w: .*error|.*error:|.*Error:|FAILURE|> Task .*FAILED|Caused by)' build.log | head -60 || true
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            head -40 app/build/reports/lint-results-debug.txt || true
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mrsad-debug-apk
          path: mrsad/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrsad-reports
          path: |
            mrsad/core/build/reports/tests/test/**
            mrsad/app/build/reports/**
            mrsad/app/build/test-results/**
            mrsad/app/build/outputs/logs/**
          if-no-files-found: ignore

  e2e:
    name: Emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          emulator-boot-timeout: 420
          disable-animations: true
          script: cd mrsad && ./gradlew --console=plain --no-daemon :app:connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrsad-androidtest-reports
          path: mrsad/app/build/reports/androidTests/**
          if-no-files-found: ignore
