name: mrsad managed gateway

on:
  push:
    paths: ['dana-android/gateway/**', '.github/workflows/mrsad-gateway.yml']
  pull_request:
    paths: ['dana-android/gateway/**', '.github/workflows/mrsad-gateway.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: dana-android/gateway
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify one-account routing, output validation and quotas with isolated providers
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m unittest discover -s tests -v
