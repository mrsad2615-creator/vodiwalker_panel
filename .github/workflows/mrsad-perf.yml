name: MRSAD Performance

# The performance comparison of the interface.
#
# Two builds of the app are measured on the same emulator, in the same
# job, with the same script: the revision before the redesign and the
# revision after it. The numbers come from the platform's own
# `FrameMetrics`, so the comparison is a measurement and not an estimate.
#
# The report of every run is uploaded as an artefact, the comparison of
# the two runs is written into `PERF-COMPARISON.md`, and both the report
# and the comparison are published as annotations, so that they can be
# read without downloading anything.

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'The revision the redesign is compared against'
        required: false
        default: '465b3e532cadeefb167a9fa2c8303fcea6549d41'
  push:
    paths:
      - 'mrsad/**'
      - '.github/workflows/mrsad-perf.yml'

permissions:
  contents: read

concurrency:
  group: mrsad-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: ${{ github.event.inputs.baseline_ref || '465b3e532cadeefb167a9fa2c8303fcea6549d41' }}
            checkout: baseline
          - label: redesign
            ref: ${{ github.sha }}
            checkout: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: ${{ matrix.checkout }}

      # The benchmark itself is taken from the head of the branch, so the
      # two runs are measured by exactly the same instrument.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: instrument

      - name: Install the benchmark into the checkout
        shell: bash
        run: |
          set -euo pipefail
          checkout="$GITHUB_WORKSPACE/${{ matrix.checkout }}"
          source_dir="$GITHUB_WORKSPACE/instrument/mrsad/app/src/androidTest/kotlin/dev/mrsad/app"
          target_dir="$checkout/mrsad/app/src/androidTest/kotlin/dev/mrsad/app"
          mkdir -p "$target_dir"
          cp "$source_dir/PerformanceBenchmarkTest.kt" "$target_dir/"
          # The runner script is part of the instrument as well: the
          # baseline revision does not have it.
          mkdir -p "$checkout/mrsad/.ci"
          cp "$GITHUB_WORKSPACE/instrument/mrsad/.ci/run-perf-benchmark.sh" "$checkout/mrsad/.ci/"
          chmod +x "$checkout/mrsad/.ci/run-perf-benchmark.sh"
          echo "the benchmark of the head revision now measures ${{ matrix.ref }}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the benchmark on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          emulator-boot-timeout: 420
          # The measurement has to see the animated application, so the
          # platform animations are left alone.
          disable-animations: false
          script: cd $GITHUB_WORKSPACE/${{ matrix.checkout }}/mrsad && bash .ci/run-perf-benchmark.sh . "$GITHUB_WORKSPACE/perf-${{ matrix.label }}.json" "$GITHUB_WORKSPACE/screenshots-${{ matrix.label }}"
      - name: Report what happened
        if: failure() || cancelled()
        shell: bash
        run: |
          set -uo pipefail
          python3 "$GITHUB_WORKSPACE/instrument/mrsad/.ci/report_failure.py" \
            "$GITHUB_WORKSPACE/${{ matrix.checkout }}/mrsad/perf-benchmark.log" || true
      - name: Collect the report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/perf-${{ matrix.label }}.json" ]; then
            echo "the report of the ${{ matrix.label }} run:"
            cat "$GITHUB_WORKSPACE/perf-${{ matrix.label }}.json"
          else
            echo "the ${{ matrix.label }} run produced no report"
          fi
      - name: Publish the report and the screenshots
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          python3 "$GITHUB_WORKSPACE/instrument/.github/scripts/annotate.py" \
            "$GITHUB_WORKSPACE/perf-${{ matrix.label }}.json" \
            "MRSAD measurement (${{ matrix.label }})"
          python3 "$GITHUB_WORKSPACE/instrument/.github/scripts/annotate.py" \
            "$GITHUB_WORKSPACE/${{ matrix.checkout }}/mrsad/screenshot-collection.txt" \
            "MRSAD screenshots (${{ matrix.label }})"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrsad-perf-${{ matrix.label }}
          path: |
            perf-${{ matrix.label }}.json
            screenshots-${{ matrix.label }}/**
          if-no-files-found: ignore

  compare:
    name: Compare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: measure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mrsad-perf-baseline
          path: baseline
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: mrsad-perf-redesign
          path: redesign
        continue-on-error: true
      - name: Write the comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/compare_perf.py \
            baseline/perf-baseline.json \
            redesign/perf-redesign.json \
            PERF-COMPARISON.md
          echo "----- the comparison -----"
          cat PERF-COMPARISON.md
      - name: Publish the comparison
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## The measurement"
            echo
            cat PERF-COMPARISON.md
          } >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/annotate.py PERF-COMPARISON.md "MRSAD comparison"
      - name: Upload the comparison
        uses: actions/upload-artifact@v4
        with:
          name: mrsad-perf-comparison
          path: |
            PERF-COMPARISON.md
            baseline/**
            redesign/**
          if-no-files-found: ignore

  # The measurement belongs in the repository, not only in the artefacts of
  # a run: the screenshots are the visual evidence of the claim, and the
  # comparison is the evidence of the numbers.
  publish:
    name: Publish the evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: compare
    if: github.ref_type == 'branch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: mrsad-perf-comparison
          path: evidence
        continue-on-error: true
      - name: Write the evidence into the repository
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p benchmarks/screenshots/baseline benchmarks/screenshots/redesign
          if [ -f evidence/PERF-COMPARISON.md ]; then
            cp evidence/PERF-COMPARISON.md PERF-COMPARISON.md
          fi
          cp evidence/baseline/screenshots-baseline/*.png \
             benchmarks/screenshots/baseline/ 2>/dev/null || true
          cp evidence/redesign/screenshots-redesign/*.png \
             benchmarks/screenshots/redesign/ 2>/dev/null || true
          find benchmarks -name '*.png' -size +2M -delete 2>/dev/null || true
          echo "----- what is published -----"
          ls -la benchmarks/screenshots/baseline benchmarks/screenshots/redesign 2>/dev/null || true
      - name: Commit the evidence
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PERF-COMPARISON.md benchmarks 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "the measurement did not change, so there is nothing to publish"
            exit 0
          fi
          git commit \
            -m "Publish the measured comparison of the interface" \
            -m "Measured by the MRSAD Performance workflow on an emulator, with the platform's own FrameMetrics. The numbers and the screenshots are the evidence of the redesign."
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"
