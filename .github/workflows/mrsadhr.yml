name: MrsadHR Android
on:
  workflow_dispatch:
  push:
    paths: ['MrsadHR/**', '.github/workflows/mrsadhr.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: MrsadHR}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: false}
      - name: Compile APK and run clock tests
        run: |
          ./gradlew --console=plain testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease 2>&1 | tee "$RUNNER_TEMP/compile.log" || {
            grep -Ei '(^e:|^error:|^exception:|^> |failed|caused by:|incompatible)' "$RUNNER_TEMP/compile.log" | tail -35 > "$RUNNER_TEMP/errors.log"
            python3 -c 'import pathlib,os; print("::error::"+pathlib.Path(os.environ["RUNNER_TEMP"],"errors.log").read_text()[-3800:].replace("%","%25").replace("\n","%0A"))' 
            exit 1
          }
        shell: bash
      - uses: actions/upload-artifact@v4
        with: {name: MrsadHR-debug, path: MrsadHR/app/build/outputs/apk/debug/*.apk}
      - name: Enable emulator acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: cd MrsadHR && ./gradlew connectedDebugAndroidTest
      - name: Report instrument failures
        if: failure()
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for t in ET.parse(f).iter('testcase'):
                  err=t.find('failure')
                  if err is not None: print('::error::'+t.attrib['name']+': '+(err.text or '')[:3600].replace('\n','%0A'))
          PYTEST

  # Explicit opt-in: only attach the tested binary to the branch that requested it.
  deliver:
    needs: verify
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deliver apk]')
    permissions: {contents: write, actions: read}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: MrsadHR-debug, path: '${{ runner.temp }}/package'}
      - name: Save verified installable
        run: |
          mkdir -p releases
          cp "$RUNNER_TEMP/package/app-debug.apk" releases/MrsadHR-debug.apk
          sha256sum releases/MrsadHR-debug.apk > releases/MrsadHR-debug.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/MrsadHR-debug.apk releases/MrsadHR-debug.apk.sha256
          git commit -m 'Attach emulator-tested MrsadHR debug APK'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
