name: MrsadHR Android
on:
  workflow_dispatch:
  push:
    paths: ['MrsadHR/**', '.github/workflows/mrsadhr.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: MrsadHR}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with: {name: MrsadHR-debug, path: MrsadHR/app/build/outputs/apk/debug/*.apk}
      - name: Enable emulator acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: cd MrsadHR && ./gradlew connectedDebugAndroidTest
