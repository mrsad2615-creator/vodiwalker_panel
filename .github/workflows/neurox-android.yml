name: NEUROX Android verification

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/neurox-android.yml"

permissions:
  contents: read

env:
  ANDROID_HOME: ${{ runner.temp }}/android-sdk
  ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and build debug APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurox-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
