name: NEUROX Android verification

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/neurox-android.yml"

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Select runner Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$sdk_root"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$sdkmanager_path"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "Using Android SDK at $sdk_root"

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and build debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest assembleDebug > "$RUNNER_TEMP/neurox-gradle.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/neurox-gradle.log"
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/neurox-gradle.log" <<'PY'
          import pathlib, sys
          text = "\n".join(pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()[-35:])
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build diagnostics::{text}")
          PY
          fi
          exit "$result"

      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurox-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
