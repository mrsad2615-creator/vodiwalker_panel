name: NEUROX native checks
on:
  workflow_dispatch:
    inputs:
      publish_tested_apk:
        description: 'Publish the already-tested NEUROX 0.5 development APK as a direct download'
        type: boolean
        default: false
  push:
    paths: ['neurox/**', '.github/workflows/neurox.yml']
  pull_request:
    paths: ['neurox/**', '.github/workflows/neurox.yml']
concurrency:
  group: neurox-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-build:
    if: ${{ !inputs.publish_tested_apk }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neurox
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Use the hosted runner Android SDK
        run: |
          test -d "$ANDROID_HOME" || { echo '::error::The hosted runner Android SDK is missing'; exit 1; }
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            sdkmanager 'platforms;android-36' 'build-tools;36.0.0' || { echo '::error::Android platform installation failed'; exit 1; }
          fi
      - name: Install standalone Kotlin compiler
        run: npm install --prefix ../.local/tools/kotlin kotlin-compiler@2.2.21 --no-audit --no-fund
      - name: Core tests and static invariants
        env:
          NEUROX_CONTENT_REVIEW_OUT: ${{ github.workspace }}/neurox/test-output/learning-content.json
        run: scripts/test-core.sh
      - name: Install pinned browser review tools
        run: scripts/bootstrap-design.sh
      - name: Browser syntax, layout, accessibility and content review
        run: python3 scripts/test-browser-review.py
      - name: Parse all Kotlin and Gradle source files
        run: scripts/check-kotlin-syntax.sh
      - name: Assemble and lint Android project
        run: scripts/ci-native-build.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: neurox-debug-not-a-production-release
          path: neurox/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neurox-check-reports
          path: |
            neurox/test-output/*.*
            neurox/test-output/design/
            neurox/test-output/content-review/
            neurox/app/build/reports/
            neurox/core/data/schemas/
  emulator-tests:
    if: ${{ !inputs.publish_tested_apk }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neurox
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: neurox
          script: scripts/ci-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neurox-device-test-reports
          path: |
            neurox/**/build/reports/androidTests/
            neurox/**/build/outputs/androidTest-results/
            neurox/test-output/android-device.log

  publish-tested-download:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tested_apk }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neurox-debug-not-a-production-release
          path: download
          run-id: 45504195689
          github-token: ${{ github.token }}
      - name: Verify tested APK and publish direct development download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          trap 'echo "::error title=Download publication failure::Command failed at line $LINENO: $BASH_COMMAND"' ERR
          find download -type f
          cd download
          echo '768a1d8ead3692059dfe626cb3744057c8189607dd771e0804af3c3509d4a036  app-debug.apk' | sha256sum --check
          mv app-debug.apk neurox-0.5.0-dev.apk
          sha256sum neurox-0.5.0-dev.apk > SHA256SUMS.txt
          gh release upload neurox-v0.5.0-dev-apk neurox-0.5.0-dev.apk SHA256SUMS.txt 2> release-error.txt || { echo "::error title=Release error::$(cat release-error.txt)"; exit 1; }
