name: VodiGesture APK

# Builds the Android 14/15 app with the real Android toolchain (SDK 35, JDK 21, Gradle 8.11.1),
# runs the reproducible quality gates, and publishes installable APKs as release assets so the
# download is a single click.
on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/vodigesture-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the APKs'
        type: boolean
        default: true

concurrency:
  group: vodigesture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dkotlin.daemon.jvmargs=-Xmx2g

jobs:
  gates:
    name: JVM engine tests + standards audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Kotlin compiler 2.1.20
        run: |
          set -euo pipefail
          mkdir -p "$HOME/kotlin"
          curl -sSL --retry 3 -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          unzip -q /tmp/kotlin.zip -d "$HOME/kotlin"
          echo "KOTLIN_HOME=$HOME/kotlin/kotlinc" >> "$GITHUB_ENV"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          "$HOME/kotlin/kotlinc/bin/kotlinc" -version

      - name: Install audit toolchain
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install tree-sitter tree-sitter-kotlin defusedxml lxml

      - name: Compile pure-Kotlin engines + run the JVM suite (-Werror, JVM 21)
        run: bash tools/run_kotlin_tests.sh

      - name: Android 14/15 standards audit (ARCH / API / MANIFEST / M3 / DOC)
        run: python3 tools/audit_android_standards.py --json android/docs/standards_audit.json

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standards-audit
          path: |
            android/docs/standards_audit.json
            android/docs/m3_contrast_audit.json
          if-no-files-found: warn

  apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: gates
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs the Gradle 8.11.1 distribution and configures the dependency cache.
      # The project intentionally does not commit gradle-wrapper.jar (it is a binary blob);
      # CI materialises it from the provisioning Gradle so `./gradlew` works afterwards.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false
          cache-read-only: false

      # The ubuntu runner image ships the Android command line tools; we only add the platform
      # and build-tools this project compiles against, avoiding a third-party action dependency.
      - name: Install Android SDK platform 35 + build tools
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          SDKMANAGER="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$sdk_root" > android/local.properties
          grep -q '^sdk.dir=' android/local.properties

      - name: Materialise the Gradle wrapper
        working-directory: android
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          ./gradlew --version

      - name: Compile Kotlin + Compose (fast failure signal)
        run: |
          set -euo pipefail
          bash tools/ci_gradle.sh compile :app:compileDebugKotlin \
            --stacktrace --no-configuration-cache

      - name: Assemble debug APK
        run: |
          set -euo pipefail
          bash tools/ci_gradle.sh debug :app:assembleDebug \
            --stacktrace --no-configuration-cache

      # A stable signing key keeps in-place app upgrades working between builds. It is a CI-only
      # key (never suitable for Play Store uploads) and lives in the Actions cache, not in git.
      - name: Provision the CI signing keystore
        id: keystore
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/vodigesture-ci.jks"
          if ! keytool -list -keystore "$key" -storepass vodigesture >/dev/null 2>&1; then
            keytool -genkeypair -v \
              -keystore "$key" \
              -storetype PKCS12 \
              -alias vodigesture-ci \
              -keyalg RSA -keysize 4096 -validity 10950 \
              -storepass vodigesture -keypass vodigesture \
              -dname "CN=VodiGesture CI, OU=Release Engineering, O=VodiGesture, L=Gunzenhausen, C=DE"
          fi
          test -s "$key" || { echo "::error::keystore was not created"; exit 1; }
          keytool -list -keystore "$key" -storepass vodigesture | grep -qi "vodigesture-ci" \
            || { echo "::error::keystore has no vodigesture-ci alias"; exit 1; }
          echo "keystore=$key" >> "$GITHUB_OUTPUT"
          echo "keystore ready at $key ($(stat -c%s "$key") bytes, alias vodigesture-ci)"

      - name: Assemble signed release APK (R8 full mode + resource shrinking)
        env:
          VODI_KEYSTORE: ${{ steps.keystore.outputs.keystore }}
        run: |
          set -euo pipefail
          case "$VODI_KEYSTORE" in
            *" "*|"") echo "::error::keystore path is empty or contains whitespace: '$VODI_KEYSTORE'"; exit 1 ;;
          esac
          test -s "$VODI_KEYSTORE"
          bash tools/ci_gradle.sh release \
            :app:assembleRelease \
            "-Pvodigesture.ciKeystore=$VODI_KEYSTORE" \
            "-Pvodigesture.ciStorePassword=vodigesture" \
            "-Pvodigesture.ciKeyAlias=vodigesture-ci" \
            "-Pvodigesture.ciKeyPassword=vodigesture" \
            --stacktrace --no-configuration-cache

      - name: Verify packaged APK manifest contract
        run: |
          set -euo pipefail
          bash tools/ci_gradle.sh verify :app:verifyPackagedApk \
            --stacktrace --no-configuration-cache

      - name: Verify release APK signature + installability
        run: |
          set -uo pipefail
          # Make a signing regression diagnosable from the annotation stream alone.
          for f in android/app/build/outputs/apk/release/output-metadata.json; do
            [ -f "$f" ] && head -c 1200 "$f" && echo
          done
          for d in android/app/build/outputs/apk/release; do
            find "$d" -maxdepth 1 -type f -printf '%f %s bytes\n'
          done
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -z "$apk" ]; then
            echo "::error::no release APK produced"; exit 1
          fi
          echo "apk=$apk ($(stat -c%s "$apk") bytes)"

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME is not set"; exit 1
          fi
          bt="$(find "$sdk_root/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)"
          echo "build-tools=$bt"

          fail=0

          # 1) Alignment (required for install on every supported API level).
          if "$bt/zipalign" -c -P 16 -v 4 "$apk" > zipalign.txt 2>&1; then
            echo "zipalign: OK"
          else
            echo "::error::zipalign verification failed"
            tail -n 20 zipalign.txt
            fail=1
          fi

          # 2) Signature: apksigner's exit status is authoritative.
          if "$bt/apksigner" verify --verbose --print-certs "$apk" > apksigner.txt 2>&1; then
            echo "apksigner: OK"
            grep -iE "^Verified using|^Signer #1 certificate DN" apksigner.txt | head -n 6
          else
            echo "::error::apksigner verify failed"
            head -n 25 apksigner.txt | while IFS= read -r l; do
              echo "::error::apksigner: $l"
            done
            fail=1
          fi

          # 3) The file is a real APK with a resolvable manifest.
          if "$bt/aapt2" dump badging "$apk" > badging.txt 2>&1; then
            grep -E "^package:|^sdkVersion|^minSdkVersion|^targetSdkVersion" badging.txt | head -n 5
            echo "aapt2: OK"
          else
            echo "::error::aapt2 could not read the APK"
            head -n 20 badging.txt
            fail=1
          fi

          exit "$fail"

      - name: Collect APKs with stable names
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(sed -n 's/^VERSION_NAME=//p' android/gradle.properties)"
          name="VodiGesture-${version}"
          debug_apk="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)"
          test -n "$debug_apk"
          cp "$debug_apk" "dist/${name}-debug.apk"
          release_apk="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
          test -n "$release_apk"
          cp "$release_apk" "dist/${name}-release.apk"
          ls -lh dist
          {
            echo "ASSET_NAME=${name}"
            echo "APK_SHA256=$(sha256sum "dist/${name}-release.apk" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vodigesture-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release with one-click APK downloads
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vodigesture-latest
          name: VodiGesture ${{ env.ASSET_NAME }} (build ${{ github.run_number }})
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ## VodiGesture ${{ env.ASSET_NAME }}

            Gesture automation for Android 10–15 (minSdk 29, targetSdk 35).

            ### One-click download
            Click `${{ env.ASSET_NAME }}-release.apk` — the browser saves it directly.

            | Asset | Use |
            | --- | --- |
            | `${{ env.ASSET_NAME }}-release.apk` | **Install this.** R8 full-mode + resource-shrunk (~3 MB), signed and ready to install. |
            | `${{ env.ASSET_NAME }}-debug.apk` | Unminified build for bug reports (~60 MB). Install alongside the release build. |

            `SHA-256 (${{ env.ASSET_NAME }}-release.apk)` = `${{ env.APK_SHA256 }}`

            ### Install
            1. Download the `-release.apk`.
            2. Allow "install unknown apps" for the browser / file manager when Android asks.
            3. Open VodiGesture and complete the Privacy & Accessibility onboarding.
            4. On Android 13–15 sideloads: App info → ⋮ → **Allow restricted settings**, then enable
               the VodiGesture accessibility service.

            ### Verified before packaging
            * 34 JVM engine tests on OpenJDK 21 (`kotlinc -Werror`, K2).
            * Android 14/15 standards audit: 0 errors (ARCH / API / MANIFEST / M3 / DOC).
            * Build log and `standards-audit` artifact attached to the workflow run.
          files: |
            dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the stable tag at this build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/vodigesture-latest" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          echo "vodigesture-latest -> $GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-logs
          path: |
            android/ci-logs/*.log
            android/**/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
