# Project Identity (centralized single-point configuration)
PROJECT_NAME=VodiGesture
APPLICATION_ID=com.vodiwalker.gesture
VERSION_NAME=1.0.0
VERSION_CODE=10000

# SDK Targets — Android 10 (API 29) min, Android 14/15 (API 35) target & compile
MIN_SDK=29
TARGET_SDK=35
COMPILE_SDK=35

# Gradle & JVM 21 Performance Tuning
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX & R8 Full Mode (strict zero-bloat optimization)
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.enableR8.fullMode=true

# Kotlin K2 Compiler Standards
kotlin.code.style=official
ksp.incremental=true
