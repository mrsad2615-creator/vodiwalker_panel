# Project Identity (centralized single-point configuration)
PROJECT_NAME=VodiGesture
APPLICATION_ID=com.vodiwalker.gesture
VERSION_NAME=1.0.0
VERSION_CODE=10000

# SDK Targets — Android 10 (API 29) min, Android 14/15 (API 35) target & compile
MIN_SDK=29
TARGET_SDK=35
COMPILE_SDK=35

# Gradle & JVM 21 Performance Tuning
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is intentionally disabled: AGP + Hilt + KSP are not fully CC-safe yet.
org.gradle.configuration-cache=false

# AndroidX & R8 Full Mode (strict zero-bloat optimization)
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.enableR8.fullMode=true
# Room 2.7 incremental schema export (no extra build step needed)
android.experimental.enableSourceSetPathsMap=true
android.experimental.cacheCompileLibResources=true

# Kotlin K2 Compiler Standards
kotlin.code.style=official
ksp.incremental=true
# Dagger/Hilt 2.55 is validated against KSP1; KSP2 support lands in Dagger 2.56+.
ksp.useKSP2=false
# Set to false only for triage builds; the release gate keeps this at true.
vodigesture.kotlinWarningsAsErrors=true
