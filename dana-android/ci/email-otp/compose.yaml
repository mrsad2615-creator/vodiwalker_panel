# Integration test only. Uses synthetic recipients and a disposable local mail sink.
services:
  db:
    image: postgres:15.15-alpine
    environment:
      POSTGRES_PASSWORD: ${DANA_TEST_DB_PASSWORD:?set an ephemeral test password}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 2s
      timeout: 4s
      retries: 20
  mail:
    image: axllent/mailpit:v1.34.0
    ports:
      - '127.0.0.1:18025:8025'
  templates:
    image: nginx:1.28.0-alpine
    volumes:
      - ./otp.html:/usr/share/nginx/html/otp.html:ro
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
      templates:
        condition: service_started
    ports:
      - '127.0.0.1:19999:9999'
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:19999
      GOTRUE_SITE_URL: http://127.0.0.1:19999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${DANA_TEST_DB_PASSWORD:?set an ephemeral test password}@db:5432/postgres?sslmode=disable
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${DANA_TEST_JWT_SECRET:?set an ephemeral test secret}
      GOTRUE_JWT_EXP: 300
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_EMAIL_MAGIC_LINK_ENABLED: 'true'
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_MAILER_OTP_LENGTH: 6
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://templates/otp.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://templates/otp.html
      # Short resend interval only in the disposable fixture, so both email templates are covered.
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@dana.example.test
      GOTRUE_SMTP_SENDER_NAME: Dana fixture
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:9999/health]
      interval: 3s
      timeout: 4s
      retries: 20
