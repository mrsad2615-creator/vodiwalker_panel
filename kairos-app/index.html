<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Deliberately NO viewport-fit=cover.
         Android 15+ forces edge-to-edge, and Capacitor only lets the WebView
         handle the insets itself when the page asks for `cover`. Without it
         Capacitor pads the WebView by the real status-bar / gesture-bar insets
         on every WebView version, which is the deterministic behaviour we want. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-max-scale=5" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="background-color" content="#0A0A0C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KAIROS" />
    <meta
      name="description"
      content="کایروس (KAIROS) — اپلیکیشن لوکس مدیریت وظایف، عادت‌ها، تقویم شمسی، تمرکز و تحلیل عملکرد"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/kairos-icon-192.png" />
    <link rel="apple-touch-icon" href="/kairos-icon-192.png" />
    <title>KAIROS | کایروس — استودیوی نظم و تمرکز</title>
  </head>
  <body class="bg-[#0A0A0C] text-[#ECECEF] antialiased selection:bg-[#6E56CF]/35 selection:text-[#ECECEF]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
